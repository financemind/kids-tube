<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Layout: big show buttons on top, a grid of large thumbnails below; the player covers the whole screen. */
:root {
  --sky: #dff1ff;
  --ink: #1d2b4f;
  --sun: #ffc93c;
  --tomato: #ff6b5b;
  --leaf: #3bb273;
  --card: #ffffff;
  --shade: rgba(29, 43, 79, .12);
  --display: "Fredoka", "Vazirmatn", system-ui, sans-serif;
  --body: "Vazirmatn", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 6px solid var(--tomato); outline-offset: 4px; }
/* TV remote: the picked picture grows and gets a thick yellow ring. */
.video:focus-visible { outline: 8px solid var(--sun); outline-offset: 4px; transform: scale(1.04); transition: transform .15s; }

.home {
  max-width: 1200px; margin: 0 auto;
  padding-block: max(16px, env(safe-area-inset-top)) 40px;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  display: grid; gap: 20px;
}
.parents {
  position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: 40px; height: 40px; border-radius: 50%; opacity: .35; display: grid; place-items: center;
  touch-action: none;
}
.parents svg { width: 20px; height: 20px; fill: var(--ink); }
.parents.holding { opacity: 1; background: var(--sun); transition: background 2s; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; direction: ltr; }
/* TV and big landscape screens: every picture fits on one screen, no scrolling (sizes set in fitGrid). */
.home.fit { max-width: none; padding-bottom: 16px; gap: 12px; }
.home.fit .grid { gap: 14px; justify-content: center; }
.video {
  display: block; background: var(--card); border-radius: 24px; overflow: hidden; padding: 0;
  box-shadow: 0 6px 0 var(--shade); border: 5px solid var(--card); transition: transform .12s;
}
.video:active { transform: scale(.97); }
.video img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--shade); }
.video img { border-radius: 19px; }

/* Time left today: a big bar that shrinks from the sun toward the moon.
   White lines split it into 10-minute pieces the child can see go away. */
.budget { display: flex; align-items: center; gap: 12px; direction: ltr; }
.budget .sun, .budget .moon-s { font-size: 40px; line-height: 1; }
.track {
  flex: 1; height: 38px; border-radius: 19px; background: var(--card); overflow: hidden; position: relative;
  box-shadow: inset 0 3px 0 var(--shade);
}
.tracks { flex: 1; display: flex; gap: 14px; }
.track.waiting { opacity: .45; }
.track i { display: block; height: 100%; width: 100%; background: var(--leaf); border-radius: 19px; transition: width .6s, background .6s; }
.track i.low { background: var(--sun); }
.track i.last { background: var(--tomato); }
.track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--piece) - 2px), var(--card) calc(var(--piece) - 2px) calc(var(--piece) + 2px), transparent calc(var(--piece) + 2px)); }
.left-text { margin: -10px 0 0; text-align: center; font-size: 14px; opacity: .6; }
.rest { display: grid; justify-items: center; gap: 12px; padding-block: 12vh; text-align: center; }
.rest .moon { font-size: clamp(110px, 22vw, 180px); line-height: 1; animation: bob 2.4s ease-in-out infinite; }
.rest p { margin: 0; font-family: var(--body); font-weight: 700; font-size: 20px; opacity: .75; }

/* Player screen */
.stage { position: fixed; inset: 0; background: #0d1426; display: grid; grid-template-rows: 1fr auto; z-index: 5; }
.frame { position: relative; overflow: hidden; }
.frame > div, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
/* Shield: stops every tap from reaching YouTube (no titles, logos, or suggested videos can be opened). */
.shield { position: absolute; inset: 0; z-index: 2; }
.cover {
  position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
  background: #0d1426 center/cover no-repeat;
}
.cover::before { content: ""; position: absolute; inset: 0; background: rgba(13, 20, 38, .45); }
.bigbtn {
  position: relative; width: 132px; height: 132px; border-radius: 50%; background: var(--sun);
  display: grid; place-items: center; box-shadow: 0 8px 0 rgba(0,0,0,.25);
}
.bigbtn svg { width: 64px; height: 64px; fill: var(--ink); }
/* Next video: a ring around the play button empties over 4 seconds, then it plays. */
.bigbtn.next { overflow: visible; }
.bigbtn .count { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); transform: rotate(-90deg); fill: none; }
.bigbtn .count circle { stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 402; animation: countdown 4s linear forwards; }
@keyframes countdown { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 402; } }
.bar {
  display: flex; justify-content: center; align-items: center; gap: clamp(16px, 5vw, 48px); direction: ltr;
  padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.round { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
.round svg { width: 36px; height: 36px; fill: #fff; }
.home-btn { background: var(--tomato); }
.rotate-btn { background: #8a5cf6; }
.restart-btn { background: #2fa7e0; }
.rotate-btn svg { transition: transform .3s; }
/* Rotate button: turns the whole player a quarter turn, for watching lying on one side. */
.stage.r90, .stage.r270 { inset: auto; top: 50%; left: 50%; width: 100vh; height: 100vw; width: 100dvh; height: 100dvw; }
.stage.r90 { transform: translate(-50%, -50%) rotate(90deg); }
.stage.r180 { transform: rotate(180deg); }
.stage.r270 { transform: translate(-50%, -50%) rotate(270deg); }
.play-btn { background: var(--leaf); }
.msg { position: relative; color: #fff; font-family: var(--body); font-weight: 700; font-size: 22px; text-align: center; padding: 0 20px; }
.done { display: grid; gap: 22px; justify-items: center; }
/* Time is up: an alarm clock rings, then the slide (break) or moon (day over) pops in. */
.ring { position: relative; font-size: clamp(120px, 26vmin, 200px); line-height: 1; transform-origin: 50% 30%; animation: ring .12s ease-in-out infinite alternate; }
.ring::before, .ring::after { content: ""; position: absolute; top: 18%; width: 22%; height: 40%; border: 6px solid #fff; border-radius: 50%; opacity: .8; animation: waves .5s ease-out infinite; }
.ring::before { left: -24%; border-color: transparent transparent transparent #fff; }
.ring::after { right: -24%; border-color: transparent #fff transparent transparent; }
@keyframes ring { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
@keyframes waves { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.3); } }
.pop { font-size: clamp(110px, 24vmin, 180px); line-height: 1; animation: pop .7s cubic-bezier(.3, 1.6, .5, 1) both, bob 2.4s ease-in-out .7s infinite; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.done .msg.small { font-size: 18px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .ring, .ring::before, .ring::after, .pop, .rest .moon { animation: none !important; } }
</style>
</head>
<body>

<main class="home" id="home">
  <div class="budget" id="budget" role="img" aria-label="Watching time left today">
    <span class="sun" aria-hidden="true">☀️</span>
    <div class="tracks" id="tracks"></div>
    <span class="moon-s" aria-hidden="true">🌙</span>
  </div>
  <p class="left-text" id="leftText"></p>
  <section class="grid" id="grid" aria-live="polite"></section>
  <section class="rest" id="rest" hidden><div class="moon" id="restIcon" aria-hidden="true">🌙</div><p id="restText">برای امروز بس است. فردا دوباره.</p></section>
</main>

<button class="parents" id="parentsBtn" aria-label="Parents: hold for 2 seconds"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3z"/></svg></button>

<section class="stage" id="stage" hidden>
  <div class="frame">
    <div id="player"></div>
    <div class="shield" id="shield"></div>
    <div class="cover" id="cover"></div>
  </div>
  <div class="bar">
    <button class="round home-btn" id="homeBtn" aria-label="Back to videos"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
    <button class="round play-btn" id="playBtn" aria-label="Play or pause"></button>
    <button class="round restart-btn" id="restartBtn" aria-label="Start from the beginning"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
    <button class="round rotate-btn" id="rotateBtn" aria-label="Turn the picture"><svg viewBox="0 0 24 24"><path d="M12 4V1L7 5l5 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  </div>
</section>

<script>
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  again: '<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>',
};
const END_TRIM = 15; // seconds: stop before YouTube's end-screen video tiles appear
const $ = (id) => document.getElementById(id);
const thumb = (id, q = "hqdefault") => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
let data = { categories: [] }, player = null, apiReady = false, tick = null;
let playingCat = null, playingId = null, locked = false, pending = null;

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* Watch time, per show per local day, in seconds. Each device keeps its own
   counts (mine) and the server returns the sum of all other devices (others),
   so every phone and tablet shares one day. watch/vwatch = mine + others. */
const API = "https://ntv.financemind.com/api/sync";
function parse(k) { try { return JSON.parse(load(k) || "{}") || {}; } catch (e) { return {}; } }
const mine = { watch: parse("watch"), vwatch: parse("vwatch"), turnEnds: parse("turnEnds"), pos: parse("pos") };
/* Action log: every open, play, pause, home, end, time-up… with the time, the
   video and how long it was watched. Kept here until the server has it. */
let logQueue = [];
try { logQueue = JSON.parse(load("log") || "[]") || []; } catch (e) { logQueue = []; }
let sessionSecs = 0; // seconds watched since the video was opened
function logAction(a, extra) {
  const ev = { at: Date.now(), a };
  if (playingId && !["app", "show", "hide"].includes(a)) {
    ev.v = playingId; ev.s = playingCat && playingCat.key; ev.w = sessionSecs;
    try { ev.t = Math.floor(player.getCurrentTime()) || 0; } catch (e) { /* player not ready yet */ }
  }
  Object.assign(ev, extra);
  logQueue.push(ev);
  if (logQueue.length > 2000) logQueue = logQueue.slice(-2000);
  save("log", JSON.stringify(logQueue));
}
let others = parse("others"); // last server reply, so starting offline still counts other devices
let device = load("device");
if (!device) { device = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); save("device", device); }
/* A plain name for this device, so the parents' report can tell them apart. */
function deviceLabel() {
  const ua = navigator.userAgent;
  if (/SmartTV|SMART-TV|Tizen|Web0S|webOS|BRAVIA|HbbTV|NetCast|Android TV|GoogleTV|AFT[A-Z]|CrKey|Roku|Xbox|PlayStation/i.test(ua)) return "تلویزیون";
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) || (/Android/.test(ua) && !/Mobile/.test(ua))) return "تبلت";
  if (/iPhone|Mobi|Android/.test(ua)) return "گوشی";
  return "لپ‌تاپ یا کامپیوتر";
}
save("deviceLabel", deviceLabel());
const syncBody = (extra) => JSON.stringify({ device, label: deviceLabel(), resetSeen, data: mine, ...extra });
/* Where each video was left, newest wins across devices; start a little earlier. */
function resumeAt(id) {
  const a = (mine.pos || {})[id], b = ((others.pos || {})[id]);
  const p = !a ? b : !b ? a : a.at >= b.at ? a : b;
  return p && p.t > 5 ? p.t - 2 : 0;
}
function savePos(id, t) {
  mine.pos[id] = { t: Math.floor(t), at: Date.now() };
  const ids = Object.keys(mine.pos);
  if (ids.length > 150) { ids.sort((x, y) => mine.pos[x].at - mine.pos[y].at); delete mine.pos[ids[0]]; }
  save("pos", JSON.stringify(mine.pos));
}
let watch = {}, vwatch = {};
function addStores(a, b) {
  const out = {};
  for (const s of [a, b]) for (const [day, vals] of Object.entries(s || {})) {
    out[day] = out[day] || {};
    for (const [k, v] of Object.entries(vals || {})) out[day][k] = (out[day][k] || 0) + v;
  }
  return out;
}
function combine() { watch = addStores(mine.watch, others.watch); vwatch = addStores(mine.vwatch, others.vwatch); }
combine();
let syncing = false;
let resetSeen = Number(load("resetSeen")) || 0;
function wipe(ts, day) { // parents reset the time on the server: one day, or everything if no day
  for (const k of ["watch", "vwatch", "turnEnds"]) { // resume positions stay
    if (day) delete mine[k][day]; else mine[k] = {};
    save(k, JSON.stringify(mine[k]));
  }
  others = {}; save("others", "{}");
  resetSeen = ts; save("resetSeen", String(ts));
  combine();
}
async function sync(again = true) {
  if (syncing) return;
  syncing = true;
  let wiped = false;
  try {
    const sent = logQueue.length;
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: syncBody({ log: logQueue.slice(0, 500) }) });
    if (r.ok) {
      const j = await r.json();
      if (j.reset && j.reset > resetSeen) { wipe(j.reset, j.resetDay); wiped = true; }
      else {
        others = j; save("others", JSON.stringify(others)); combine();
        if (j.logged) { logQueue = logQueue.slice(Math.min(sent, j.logged)); save("log", JSON.stringify(logQueue)); }
      }
    }
  } catch (e) { /* offline: keep the last reply */ } finally { syncing = false; }
  if (wiped && again) return sync(false);
}
function dayKey(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() - offset);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function secs(key, offset) { return (watch[dayKey(offset)] || {})[key] || 0; }
/* vwatch: seconds per video per day, for the parents' page. All stores keep 31 days. */
function bump(store, key) {
  const t = dayKey();
  store[t] = store[t] || {};
  store[t][key] = (store[t][key] || 0) + 1;
  const keep = new Set(Array.from({ length: 31 }, (_, i) => dayKey(i)));
  for (const k of Object.keys(store)) if (!keep.has(k)) delete store[k];
}
function addSecond(catKey, videoId) {
  bump(mine.watch, catKey); bump(mine.vwatch, videoId);
  bump(watch, catKey); bump(vwatch, videoId);
  save("watch", JSON.stringify(mine.watch));
  save("vwatch", JSON.stringify(mine.vwatch));
}
function allowed(c) {
  if (!c.limit) return true;
  let week = 0;
  for (let i = 0; i < 7; i++) week += secs(c.key, i);
  return secs(c.key, 0) < c.limit.day * 60 && secs(c.key, 1) < c.limit.day * 60 && week < c.limit.week * 60;
}
const showOf = (key) => data.categories.find((c) => c.key === key);

/* One list a day, picked by score (settings in data.daily). The score uses
   only yesterday and earlier, so the list stays the same all day. */
function seeded(str) { // small deterministic random generator from a string
  let h = 2166136261;
  for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
}
const cfg = () => data.daily || {};
function recentMinutes(store, key) { // yesterday counts fully, 7 days ago counts 1/7
  let m = 0;
  for (let d = 1; d <= 7; d++) m += (((store[dayKey(d)] || {})[key] || 0) / 60) * (8 - d) / 7;
  return m;
}
function taper() {
  const start = new Date((cfg().start || "2026-11-16") + "T00:00:00");
  const week = Math.max(0, Math.floor((new Date() - start) / (7 * 86400000)));
  return Math.pow(cfg().taperPerWeek || 0.7, week);
}
function score(v) {
  const c = showOf(v.show), k = cfg();
  if (!c || (c.limit && !allowed(c))) return 0;
  if (((vwatch[dayKey(1)] || {})[v.id] || 0) >= (k.videoRestMinutes || 10) * 60) return 0; // rest a day
  let w = Math.pow(0.5, recentMinutes(vwatch, v.id) / (k.videoHalfMinutes || 10));
  w *= Math.pow(0.5, recentMinutes(watch, c.key) / (k.showHalfMinutes || 20));
  if (c.limit) w *= taper();
  return w;
}
function todaySeconds() { return Object.values(watch[dayKey()] || {}).reduce((a, b) => a + b, 0); }

/* Turns: the day has a few short turns with a break after each (breakTimes ×
   the turn length). Parents can set today's turns in the report (server
   plans); otherwise the default in videos.json. Only playing time counts. */
function plan() {
  const p = (others.plans || {})[dayKey()];
  return p || { turns: cfg().turns || 4, minutes: cfg().turnMinutes || 15 };
}
const turnSecs = () => plan().minutes * 60;
const turnCount = () => plan().turns;
function turnEnds() { // when each finished turn ended today (ms timestamps); the earliest device wins
  const a = (mine.turnEnds || {})[dayKey()] || [], b = ((others.turnEnds || {})[dayKey()]) || [];
  return Array.from({ length: Math.max(a.length, b.length) }, (_, i) =>
    a[i] && b[i] ? Math.min(a[i], b[i]) : a[i] || b[i] || null);
}
function timeState() {
  const s = todaySeconds(), T = turnSecs(), n = turnCount();
  const used = Math.min(n, Math.floor(s / T)); // turns fully used
  if (used >= n) return { mode: "tomorrow", turn: n };
  if (used > 0) {
    const ends = turnEnds();
    if (!ends[used - 1]) { ends[used - 1] = Date.now(); mine.turnEnds = { [dayKey()]: ends }; save("turnEnds", JSON.stringify(mine.turnEnds)); sync(); }
    const until = ends[used - 1] + plan().minutes * (cfg().breakTimes || 4) * 60000;
    if (Date.now() < until) return { mode: "break", turn: used, until };
  }
  return { mode: "watch", turn: used, left: (used + 1) * T - s };
}
const canWatch = () => timeState().mode === "watch";

/* Show scores (1-5, set in update_videos.py): real, learn, kind, calm, color, music, age. */
const traitsOf = (v) => ({ real: 3, learn: 3, kind: 3, calm: 3, color: 3, music: 3, age: 3, ...((showOf(v.show) || {}).traits || {}) });
// Shows made for his age and gentle shows come up more often.
function fit(v) { const t = traitsOf(v); return (t.age / 5) * (0.6 + 0.4 * t.kind / 5); }
// The day's mix (cfg balance): few fast or magical shows, enough teaching and quiet ones.
function balance(v, got, left) {
  const b = cfg().balance || {}, t = traitsOf(v);
  if (t.calm <= 2 && got.exciting >= (b.maxExciting ?? 3)) return 0;
  if (t.real <= 2 && got.fantasy >= (b.maxFantasy ?? 5)) return 0;
  let m = 1;
  const needLearn = Math.max(0, (b.minLearn ?? 6) - got.learn), needCalm = Math.max(0, (b.minCalm ?? 6) - got.calm);
  if (needLearn && t.learn >= 4) m *= 1 + 3 * needLearn / left;
  if (needCalm && t.calm >= 4) m *= 1 + 3 * needCalm / left;
  return m;
}
function dailyList() {
  const seen = new Set(), pool = [];
  const add = (v, show) => { if (!seen.has(v.id)) { seen.add(v.id); pool.push({ ...v, show }); } };
  for (const c of data.categories) for (const v of c.videos) add(v, c.key);
  for (const tp of data.topics || []) for (const v of tp.videos) add(v, v.show);
  const k = cfg(), size = k.size || 6, rnd = seeded(dayKey());
  let cands = pool.map((v) => ({ v, w: score(v) * fit(v) })).filter((x) => x.w > 0);
  const perShow = {}, list = [], got = { exciting: 0, fantasy: 0, learn: 0, calm: 0 };
  while (list.length < size && cands.length) {
    // Weighted draw: a higher score means a better chance; balance() keeps the day's mix.
    let ws = cands.map((x) => x.w * balance(x.v, got, size - list.length));
    if (!ws.some((w) => w > 0)) ws = cands.map((x) => x.w); // nothing fits the mix: ignore it
    const total = ws.reduce((a, w) => a + w, 0);
    let r = rnd() * total, i = 0;
    while (i < cands.length - 1 && (r -= ws[i]) > 0) i++;
    const { v } = cands.splice(i, 1)[0];
    list.push(v);
    const t = traitsOf(v);
    if (t.calm <= 2) got.exciting++;
    if (t.real <= 2) got.fantasy++;
    if (t.learn >= 4) got.learn++;
    if (t.calm >= 4) got.calm++;
    perShow[v.show] = (perShow[v.show] || 0) + 1;
    const cap = (s) => (showOf(s).limit ? (k.perLessShow || 1) : (k.perShow || 2));
    cands = cands.filter((x) => (perShow[x.v.show] || 0) < cap(x.v.show));
  }
  return list;
}

let lastMode = null;
function renderBudget() {
  const st = timeState(), T = turnSecs(), n = turnCount(), box = $("tracks");
  if (box.children.length !== n) {
    box.innerHTML = "";
    for (let i = 0; i < n; i++) box.insertAdjacentHTML("beforeend", '<div class="track"><i></i></div>');
  }
  [...box.children].forEach((tr, i) => {
    const frac = i < st.turn ? 0 : i > st.turn ? 1 : st.mode === "watch" ? st.left / T : 1; // in a break the next turn waits, full
    const bar = tr.firstChild;
    bar.style.width = (100 * frac).toFixed(1) + "%";
    bar.className = i === st.turn && frac <= 1 / 3 ? "last" : i === st.turn && frac <= 2 / 3 ? "low" : "";
    tr.classList.toggle("waiting", i > st.turn || (st.mode === "break" && i === st.turn));
    tr.style.setProperty("--piece", (100 / Math.max(1, Math.round(T / 600))).toFixed(3) + "%");
  });
  const fa = (x) => x.toLocaleString("fa-IR");
  let text = "";
  const nth = ["اول", "دوم", "سوم", "چهارم", "پنجم", "ششم", "هفتم", "هشتم"][st.turn] || fa(st.turn + 1);
  if (st.mode === "watch") text = `${fa(Math.ceil(st.left / 60))} دقیقه از نوبت ${nth} مانده`;
  else if (st.mode === "break") {
    const t = new Date(st.until);
    text = `نوبت بعدی ساعت ${fa(t.getHours())}:${String(t.getMinutes()).padStart(2, "0").replace(/\d/g, (d) => fa(+d))} باز می‌شود`;
  }
  $("leftText").textContent = text;
  return st;
}

function renderGrid() {
  const st = renderBudget();
  lastMode = st.mode;
  $("grid").innerHTML = "";
  $("rest").hidden = st.mode === "watch";
  if (st.mode !== "watch") {
    // Break: go and play. Last turn used: see you tomorrow.
    $("restIcon").textContent = st.mode === "break" ? "🛝" : "🌙";
    $("restText").textContent = st.mode === "break" ? "وقت بازی! بعداً دوباره." : "برای امروز بس است. فردا دوباره.";
    fitGrid();
    return;
  }
  for (const v of dailyList()) {
    const b = document.createElement("button");
    b.className = "video";
    // Picture only: the child can't read. The title stays for screen readers.
    b.setAttribute("aria-label", v.title);
    b.innerHTML = `<img alt="" loading="lazy" src="${thumb(v.id, "hq720")}">`;
    b.querySelector("img").onerror = function () { this.onerror = null; this.src = thumb(v.id); };
    b.onclick = () => openVideo(v, showOf(v.show));
    $("grid").appendChild(b);
  }
  fitGrid();
}

/* On a big landscape screen (TV, laptop) pick the column count that gives the
   largest pictures while all of them fit on the screen without scrolling. */
function fitGrid() {
  const home = $("home"), grid = $("grid"), n = grid.children.length;
  const big = innerWidth >= 900 && innerWidth >= innerHeight;
  home.classList.toggle("fit", big && n > 0);
  if (!big || !n || home.hidden) { grid.style.gridTemplateColumns = ""; return; }
  const gap = 14, frame = 10; // the white border around each picture
  const W = grid.clientWidth, H = innerHeight - grid.getBoundingClientRect().top - 24;
  let best = { w: 0, c: 1 };
  for (let c = 1; c <= 8; c++) {
    const rows = Math.ceil(n / c);
    const byWidth = (W - gap * (c - 1)) / c;
    const byHeight = ((H - gap * (rows - 1)) / rows - frame) * 16 / 9 + frame;
    const w = Math.min(byWidth, byHeight);
    if (w > best.w) best = { w, c };
  }
  grid.style.gridTemplateColumns = `repeat(${best.c}, ${Math.floor(best.w)}px)`;
}
addEventListener("resize", fitGrid);

function showCover(html, bg) {
  const cv = $("cover");
  cv.style.backgroundImage = bg ? `url(${bg})` : "none";
  cv.innerHTML = html;
  cv.hidden = false;
}
function homeButton(id) { return `<button class="bigbtn" id="${id}" aria-label="Back to videos" style="background:var(--tomato)">${ICON.home}</button>`; }

function openVideo(v, c) {
  playingCat = c; playingId = v.id; locked = false; sessionSecs = 0;
  const start = resumeAt(v.id);
  logAction("open", { from: start, t: start });
  $("home").hidden = true;
  $("stage").hidden = false;
  setPlayIcon(false);
  showCover(`<div class="msg">...</div>`, thumb(v.id));
  if (!apiReady) { pending = [v, c]; return; }
  if (player) { player.loadVideoById({ videoId: v.id, startSeconds: start }); return; }
  player = new YT.Player("player", {
    host: "https://www.youtube-nocookie.com",
    videoId: v.id,
    playerVars: { start: Math.floor(start), autoplay: 1, controls: 0, rel: 0, modestbranding: 1, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, cc_load_policy: 0 },
    events: { onReady: (e) => e.target.playVideo(), onStateChange: onState, onError: onErr },
  });
}
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending) { const [v, c] = pending; pending = null; openVideo(v, c); } };

function setPlayIcon(playing) { $("playBtn").innerHTML = playing ? ICON.pause : ICON.play; }

function pausedCover() {
  showCover(`<button class="bigbtn" aria-label="Play">${ICON.play}</button>`, thumb(playingId));
  $("cover").querySelector("button").onclick = () => { logAction("play"); player.playVideo(); };
}

function onState(e) {
  const S = YT.PlayerState;
  clearInterval(tick);
  if (locked) { if (e.data === S.PLAYING) player.pauseVideo(); return; }
  if (e.data === S.PLAYING) {
    $("cover").hidden = true; setPlayIcon(true);
    tick = setInterval(onTick, 1000);
    return;
  }
  setPlayIcon(false);
  if (e.data === S.ENDED) finish();
  else if (e.data === S.PAUSED) pausedCover();
  // Loading or buffering: keep YouTube's own overlays hidden behind the picture.
  else showCover("", thumb(playingId));
}

function onTick() {
  const d = player.getDuration(), t = player.getCurrentTime();
  if (playingCat) {
    addSecond(playingCat.key, playingId); sessionSecs++;
    savePos(playingId, t);
    if (!canWatch()) return stopForToday();
    if (playingCat.limit && !allowed(playingCat)) return finish();
  }
  if (d > END_TRIM * 3 && t >= d - END_TRIM) finish();
}

/* The next video in today's list after the one playing (wrapping round),
   skipping shows that reached their limit. */
let autoNext = null;
function nextVideo() {
  const list = dailyList(), i = list.findIndex((v) => v.id === playingId);
  for (let j = 1; j <= list.length; j++) {
    const v = list[(i + j + list.length) % list.length], c = showOf(v.show);
    if (v.id !== playingId && c && allowed(c)) return { v, c };
  }
  return null;
}
function finish() {
  logAction("end");
  savePos(playingId, 0); // next time it starts from the beginning
  locked = true; clearInterval(tick);
  player.pauseVideo();
  setPlayIcon(false);
  if (!canWatch()) return stopForToday();
  // Go on to the next video in today's list by itself, after a 4-second countdown.
  const next = nextVideo();
  if (next) {
    showCover(`<div class="done"><button class="bigbtn next" id="nextBtn" aria-label="Next video">${ICON.play}
      <svg class="count" viewBox="0 0 140 140"><circle cx="70" cy="70" r="64"/></svg></button>${homeButton("backBtn")}</div>`, thumb(next.v.id));
    const go = () => { clearTimeout(autoNext); if (!$("stage").hidden) openVideo(next.v, next.c); };
    autoNext = setTimeout(go, 4000);
    $("nextBtn").onclick = go;
    $("backBtn").onclick = () => { clearTimeout(autoNext); goHome(); };
    return;
  }
  showCover(`<div class="done"><div class="msg">تمام شد!</div>
    <div style="display:flex;gap:22px"><button class="bigbtn" id="againBtn" aria-label="Watch again">${ICON.again}</button>${homeButton("backBtn")}</div></div>`, null);
  $("againBtn").onclick = () => {
    if (!canWatch()) return stopForToday();
    if (playingCat && !allowed(playingCat)) return goHome();
    logAction("again"); sessionSecs = 0;
    locked = false; player.seekTo(0); player.playVideo();
  };
  $("backBtn").onclick = goHome;
}

function stopForToday() {
  logAction("timeup");
  locked = true; clearInterval(tick);
  player.pauseVideo();
  setPlayIcon(false);
  const brk = timeState().mode === "break";
  // A child can't read: first an alarm clock rings with a soft bell, then the
  // slide (go and play) or the moon (see you tomorrow) pops in with a little tune.
  showCover(`<div class="done"><div class="ring" aria-label="Time is up">⏰</div></div>`, null);
  timeUpSound();
  setTimeout(() => {
    if ($("stage").hidden) return;
    showCover(`<div class="done"><div class="pop">${brk ? "🛝" : "🌙"}</div><div class="msg small">${brk ? "وقت بازی! بعداً دوباره." : "برای امروز بس است. فردا دوباره."}</div>${homeButton("backBtn")}</div>`, null);
    $("backBtn").onclick = goHome;
  }, 2600);
}

/* Sounds are made in the browser (no files): a soft alarm-clock trill, then a
   happy music-box tune. Browsers allow sound only after a first touch or key,
   which the child has already given by starting the video. */
let audio = null;
function audioCtx() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
  return audio;
}
document.addEventListener("pointerdown", audioCtx);
document.addEventListener("keydown", audioCtx);
function bell(a, freq, at, len, vol) {
  for (const [mult, v] of [[1, vol], [2.76, vol * 0.25]]) { // a bell has a bright overtone
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = freq * mult;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(v, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g); g.connect(a.destination);
    o.start(at); o.stop(at + len + 0.05);
  }
}
function timeUpSound() {
  const a = audioCtx();
  if (!a) return;
  const t = a.currentTime + 0.05;
  for (let r = 0; r < 3; r++) for (let i = 0; i < 8; i++) bell(a, i % 2 ? 1760 : 1480, t + r * 0.75 + i * 0.07, 0.18, 0.12); // ring-ring-ring
  [784, 988, 1175, 1568].forEach((f, i) => bell(a, f, t + 2.5 + i * 0.2, 1.2, 0.2)); // happy tune going up
}

function onErr(e) {
  logAction("error", { code: e && e.data });
  locked = true;
  showCover(`<div class="done"><div class="msg">این ویدیو باز نشد.</div>${homeButton("backBtn")}</div>`, null);
  $("backBtn").onclick = goHome;
}

function goHome() {
  clearTimeout(autoNext);
  if (!$("stage").hidden) logAction("home");
  clearInterval(tick);
  locked = true;
  if (player) player.stopVideo();
  $("stage").hidden = true;
  $("home").hidden = false;
  renderGrid();
}

$("homeBtn").onclick = goHome;
$("playBtn").onclick = () => {
  if (!player || locked) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) { logAction("pause"); pausedCover(); player.pauseVideo(); }
  else { logAction("play"); player.playVideo(); }
};
// Start over: the same video from the very beginning.
$("restartBtn").onclick = () => {
  if (!player || locked) return;
  logAction("restart");
  savePos(playingId, 0);
  player.seekTo(0, true); player.playVideo();
};
$("shield").onclick = () => $("playBtn").click();
/* Each press turns the player a quarter turn clockwise; this device remembers it. */
let turn = Number(load("rotate")) || 0;
function applyTurn() {
  $("stage").classList.remove("r90", "r180", "r270");
  if (turn) $("stage").classList.add("r" + turn);
}
applyTurn();
$("rotateBtn").onclick = () => { turn = (turn + 90) % 360; save("rotate", String(turn)); applyTurn(); logAction("rotate", { deg: turn }); };
document.addEventListener("contextmenu", (e) => e.preventDefault());

/* TV remote and keyboard: arrows move between buttons, OK presses, Back goes home. */
const BACK_KEYS = new Set(["Escape", "Backspace", "GoBack", "BrowserBack", "XF86Back"]);
const BACK_CODES = new Set([10009, 461, 8, 27]); // Tizen, webOS, others
function focusables() {
  return [...document.querySelectorAll("button")].filter((b) => {
    if (b.id === "parentsBtn" || b.disabled) return false; // the lock stays a touch-only thing
    const r = b.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(b).visibility !== "hidden";
  });
}
function moveFocus(dir) {
  const all = focusables();
  if (!all.length) return;
  const cur = document.activeElement;
  if (!all.includes(cur)) return all[0].focus();
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestD = Infinity;
  for (const b of all) {
    if (b === cur) continue;
    const r = b.getBoundingClientRect(), dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
    const ok = dir === "ArrowLeft" ? dx < -4 : dir === "ArrowRight" ? dx > 4 : dir === "ArrowUp" ? dy < -4 : dy > 4;
    if (!ok) continue;
    const along = dir === "ArrowLeft" || dir === "ArrowRight" ? Math.abs(dx) : Math.abs(dy);
    const across = dir === "ArrowLeft" || dir === "ArrowRight" ? Math.abs(dy) : Math.abs(dx);
    const d = along + across * 2;
    if (d < bestD) { bestD = d; best = b; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
document.addEventListener("keydown", (e) => {
  if (e.key.startsWith("Arrow")) { e.preventDefault(); moveFocus(e.key); return; }
  const onStage = !$("stage").hidden;
  if (BACK_KEYS.has(e.key) || BACK_CODES.has(e.keyCode)) {
    if (onStage) { e.preventDefault(); goHome(); }
    return;
  }
  if (onStage && ["MediaPlayPause", "MediaPlay", "MediaPause", " "].includes(e.key)) { e.preventDefault(); $("playBtn").click(); return; }
  if ((e.key === "Enter" || e.keyCode === 13) && !focusables().includes(document.activeElement)) {
    e.preventDefault(); // OK with nothing picked: pick the first thing
    if (onStage) $("playBtn").click(); else moveFocus("ArrowDown");
  }
});

/* Fill the whole screen on the first touch or key press (browsers only allow it after one).
   An installed app already opens full screen. */
const installed = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
function goFull() {
  const el = document.documentElement;
  if (installed || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
}
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#parentsBtn")) goFull(); });
document.addEventListener("keydown", goFull);

/* Works offline after the first visit and can be installed like an app. */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// Parents' page: hold the small lock for 2 seconds.
{
  const pb = $("parentsBtn"); let hold = null;
  const start = (e) => { e.preventDefault(); pb.classList.add("holding"); hold = setTimeout(() => { location.href = "parents.html"; }, 2000); };
  const stop = () => { pb.classList.remove("holding"); clearTimeout(hold); };
  pb.addEventListener("pointerdown", start);
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) pb.addEventListener(ev, stop);
}
// A new day can unlock a show: refresh the list when the app comes back to the screen.
// Leaving the app sends this device's counts; coming back fetches the other devices'.
function refreshHome() {
  if ($("home").hidden || !data.categories.length) return;
  if (timeState().mode !== lastMode) renderGrid(); else renderBudget();
}
document.addEventListener("visibilitychange", () => {
  logAction(document.hidden ? "hide" : "show");
  if (document.hidden) {
    try { navigator.sendBeacon(API, new Blob([syncBody()], { type: "text/plain" })); } catch (e) {}
  } else if (!$("home").hidden) { renderGrid(); sync().then(refreshHome); }
});
// Every 30 seconds: share counts with the other devices and notice when a break ends.
setInterval(() => { sync().then(refreshHome); }, 30000);

logAction("app");
Promise.all([fetch("videos.json", { cache: "no-cache" }).then((r) => r.json()), sync()]).then(([d]) => {
  data = d;
  renderGrid();
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
