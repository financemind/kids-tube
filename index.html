<style>
/* Layout: big show buttons on top, a grid of large thumbnails below; the player covers the whole screen. */
:root {
  --sky: #dcf2d8;
  --ink: #1d2b4f;
  --sun: #ffc93c;
  --tomato: #ff6b5b;
  --leaf: #3bb273;
  --card: #ffffff;
  --shade: rgba(29, 43, 79, .12);
  --display: "Fredoka", "Vazirmatn", system-ui, sans-serif;
  --body: "Vazirmatn", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 6px solid var(--tomato); outline-offset: 4px; }
/* TV remote: the picked picture grows and gets a thick yellow ring. */
.video:focus-visible, .video:focus { outline: 8px solid var(--sun); outline-offset: 5px; transform: scale(1.03); transition: transform .15s; z-index: 1; }

.home {
  margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding-block: max(14px, env(safe-area-inset-top)) 18px;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
}
.home > .grid { align-self: stretch; }
.parents {
  position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: 40px; height: 40px; border-radius: 50%; opacity: .35; display: grid; place-items: center;
  touch-action: none;
}
.parents svg { width: 20px; height: 20px; fill: var(--ink); }
.parents.holding { opacity: 1; background: var(--sun); transition: background 2s; }

/* One horizontal row of pictures that scrolls sideways (finger or remote). */
/* The videos: one big list, one under the other, that scrolls up and down
   (finger or remote). Room around every picture so the yellow frame never
   gets cut off, and space between the pictures. */
.grid { display: flex; flex-direction: column; align-items: center; gap: 40px; direction: ltr; overflow-y: auto; overflow-x: hidden;
  position: relative; height: var(--listh, 60vh); padding: 30px 40px 40px; scrollbar-width: none; }
.grid::-webkit-scrollbar { display: none; }
.grid .video { flex: 0 0 auto; width: var(--tile, 100%); }
/* TV and big screens: the big clock on the left half, the list on the right. */
.home.fit { direction: ltr; grid-template-columns: var(--clockcol, 40vw) minmax(0, 1fr); grid-template-rows: 1fr auto; column-gap: 24px;
  align-items: center; padding-block: 16px; }
.home.fit .top { grid-column: 1; grid-row: 1; justify-content: center; }
.home.fit .clock { grid-template-columns: auto; justify-items: center; row-gap: 18px; }
.home.fit .bigclock { grid-row: auto; }
.home.fit .tracks { align-self: auto; gap: 14px; }
.home.fit .track { width: calc(var(--clock) * .13); height: calc(var(--clock) * .13); }
.home.fit .grid { grid-column: 2; grid-row: 1; }
.home.fit .rest { grid-column: 2; grid-row: 1; direction: rtl; }

/* TV remote: each picture shows its number, so pressing that number on the remote opens it. */
.video .num { position: absolute; top: 8px; left: 8px; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 22px;
  background: rgba(29, 43, 79, .82); color: #fff; font: 700 26px/44px var(--body); text-align: center; display: none; }
.numbers .video .num { display: block; }
/* Topic of the day, in a corner: its picture (the same one as on its videos) and its name for the parents. */
.today-topic { justify-self: start; margin: 0; display: inline-flex; align-items: center; gap: 8px; background: var(--card);
  border-radius: 99px; padding: 4px 16px 4px 10px; box-shadow: 0 4px 0 var(--shade); font: 700 17px/1.4 var(--body); }
.today-topic b { font-size: 32px; line-height: 1; }
/* A new page slides in from the side the child pressed. */
.grid.slide-l { animation: slideL .35s ease-out; }
.grid.slide-r { animation: slideR .35s ease-out; }
@keyframes slideL { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.video .topic { position: absolute; top: 6px; right: 8px; font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.video.picked { outline: 8px solid var(--sun); outline-offset: 4px; }
.video {
  position: relative;
  display: block; background: var(--card); border-radius: 24px; overflow: hidden; padding: 0;
  box-shadow: 0 6px 0 var(--shade); border: 5px solid var(--card); transition: transform .12s;
}
.video:active { transform: scale(.97); }
.video img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--shade); }
.video img { border-radius: 19px; }
/* Pictures are shown with weak colours, so the brightest thumbnail does not win the child's choice. */
.video img { filter: saturate(.5); }

/* Home screen: the time clock (on TV a big one on the left, on phones on
   top) and the list of big videos. Sizes (--clock, --tile, --listh) are
   worked out from the screen in fitGrid(). */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.parentstop { margin-inline-end: auto; align-self: flex-start; background: var(--card); color: var(--ink); text-decoration: none; font: 700 15px/1 var(--body);
  padding: 10px 14px; border-radius: 99px; box-shadow: 0 4px 0 var(--shade); }
.top .today-topic { display: none !important; } /* the parents asked for no topic label at the top */
.top { justify-content: flex-end; }
/* The clock: its coloured slice is the time left in this turn and its hand
   ticks every second, so it is clear it is alive. Small circles beside it
   show all of today's turns. */
.clock { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 6px; align-items: center; direction: ltr; }
/* Christmas clock, drawn as SVG so older TV browsers show it too: a
   red-and-white candy-cane ring, a green slice for the time left on a snowy
   face, a gold star on top and a red hand. */
.bigclock { grid-row: 1 / span 2; position: relative; width: var(--clock, 92px); height: var(--clock, 92px); border-radius: 50%;
  box-shadow: 0 6px 0 var(--shade);
  margin: calc(var(--clock, 92px) * var(--ctop, .28)) calc(var(--clock, 92px) * .04) calc(var(--clock, 92px) * var(--cbot, .04)); } /* room for the picture on top (star, flames, rocket, a whole character…) */
.bigclock .face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
/* The picture around the clock (ears, flames, a badge…): a box larger than the clock, see clock-themes.js. */
.bigclock .deco { position: absolute; left: -30%; top: -40%; width: 160%; height: 160%; overflow: visible; pointer-events: none; }

.bigclock .hand { position: absolute; left: calc(50% - var(--clock, 92px) * .022); top: 14%; width: calc(var(--clock, 92px) * .044); height: 36%;
  border-radius: 99px; background: var(--hand, #a4161a); transform-origin: 50% 100%; animation: tick 60s steps(60) infinite; }
.bigclock.still .hand { animation-play-state: paused; opacity: .35; }
.bigclock .dot { position: absolute; left: calc(50% - var(--clock, 92px) * .07); top: calc(50% - var(--clock, 92px) * .07);
  width: calc(var(--clock, 92px) * .14); height: calc(var(--clock, 92px) * .14); border-radius: 50%; background: var(--dot, #f4c430);
  box-shadow: 0 0 0 calc(var(--clock, 92px) * .02) var(--hand, #a4161a); }
/* Pairing screen: shown until this device is logged in to a family. */
.pair { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 7; display: flex; align-items: center; justify-content: center;
  background: var(--sky); padding: 24px; overflow: auto; }
.paircard { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; max-width: 1100px; }
.pairqr { width: min(46vh, 80vw); height: min(46vh, 80vw); background: #fff; border-radius: 24px; padding: 14px; box-shadow: 0 8px 0 var(--shade); }
.pairqr svg { width: 100%; height: 100%; display: block; }
.pairtext { max-width: 460px; display: grid; gap: 10px; font-family: var(--body); }
.pairtext h1 { margin: 0; font-size: 34px; }
.pairtext p { margin: 0; font-size: 19px; line-height: 1.7; }
.pairmuted { opacity: .7; font-size: 16px !important; }
.paircode { font: 700 54px/1.1 var(--body); letter-spacing: 10px; direction: ltr; text-align: center; background: #fff; border-radius: 18px; padding: 10px 18px; }
.pairlink { color: #2f5fd0; font-weight: 700; font-size: 16px; }
/* Balloon game: balloons in the four remote colours float up a blue sky;
   pressing a colour key (or tapping a balloon or a dot) pops one of that colour. */
.game { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 6; background: linear-gradient(#8fd3ff, #d9f2ff 70%, #c9ecc0); overflow: hidden; }
.sky { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.balloon { position: absolute; top: 0; width: var(--bw); height: calc(var(--bw) * 1.22); border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%;
  background-image: radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0, rgba(255,255,255,.75) 9%, rgba(255,255,255,0) 10%);
  box-shadow: inset -8px -10px 0 rgba(0,0,0,.12); cursor: pointer; }
.balloon::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--bw) * -.55); width: 2px; height: calc(var(--bw) * .55); background: rgba(29,43,79,.45); }
.balloon::before { content: ""; position: absolute; left: calc(50% - 7px); bottom: -8px; border: 7px solid transparent; border-bottom: 10px solid var(--col); transform: rotate(180deg); }
.balloon.pop { animation: pop .28s ease-out forwards; pointer-events: none; }
@keyframes pop { to { transform: scale(1.6); opacity: 0; } }
.bit { position: absolute; width: 14px; height: 14px; border-radius: 3px; animation: bit .8s ease-out forwards; pointer-events: none; }
@keyframes bit { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
.keys { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 26px; direction: ltr; }
.keys .k { display: block; width: 64px; height: 64px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); cursor: pointer; }
.k.red { background: #e63946; } .k.green { background: #2a9d4b; } .k.yellow { background: #f6c90e; } .k.blue { background: #2f7fe0; }
.gamehome { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; }
.game .done { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; align-content: center; }
.video.gamecard { display: flex; align-items: center; justify-content: center; height: calc(var(--tile, 300px) * .5625);
  background: #bfe6ff; background-image: linear-gradient(#8fd3ff, #d9f2ff); font-size: calc(var(--tile, 300px) * .2); }
.video.gamecard.huntcard { background: #fdf0d8; background-image: linear-gradient(#fff4dc, #f6e2b8); }
.video.gamecard.dinocard { background: #d4ecc0; background-image: linear-gradient(#cfe9f2, #e6f3d8 62%, #a8cf8e 62%); }
@keyframes tick { to { transform: rotate(360deg); } }
.tracks { align-self: end; display: flex; align-items: center; gap: 8px; }
.track { width: calc(var(--clock, 92px) * .24); height: calc(var(--clock, 92px) * .24); border-radius: 50%; border: 3px solid var(--card);
  box-shadow: 0 3px 0 var(--shade); background: #1e9b4f; }
.track.spent { background: #dfe7f0; }
.track.now { outline: 3px solid var(--ink); outline-offset: 1px; }
.track.low { background: #f4b400; }
.track.last { background: #d62839; }
.track.waiting { opacity: .45; }
.left-text { align-self: start; margin: 0; direction: rtl; font-size: clamp(13px, calc(var(--clock, 92px) * .1), 22px); opacity: .7; }
.top .today-topic { font-size: clamp(16px, calc(var(--clock, 92px) * .13), 28px); }
.top .today-topic b { font-size: 1.8em; }
/* Number and topic badges grow and shrink with the pictures. */
.video .num { min-width: clamp(26px, calc(var(--tile, 300px) * .1), 56px) !important; height: clamp(26px, calc(var(--tile, 300px) * .1), 56px) !important;
  line-height: clamp(26px, calc(var(--tile, 300px) * .1), 56px) !important; font-size: clamp(15px, calc(var(--tile, 300px) * .06), 32px) !important; border-radius: 99px; }
.video .topic { font-size: clamp(22px, calc(var(--tile, 300px) * .08), 52px) !important; }
/* Break and end of day: one full screen picture, no scrolling. Break: a
   sunny playground slide ("go and play"). End of day: the moon and twinkling
   stars ("see you tomorrow"). Drawn as SVG so the TV shows the colours. */
.rest { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 4; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2vh; padding: 4vh 16px; text-align: center; overflow: hidden; direction: rtl; }
.rest.break { background: linear-gradient(#8fd3ff, #d9f2ff 62%, #bfe8ad); color: #1d2b4f; }
.rest.tomorrow { background: radial-gradient(ellipse at 50% 0%, #2c3f80 0%, #14204a 55%, #0b1230 100%); color: #f2f5ff; }
.rest .scene { width: min(78vw, 92vh); height: min(52vh, 58vw); }
.rest .scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
.rest h1 { margin: 0; font: 700 clamp(30px, 7vh, 64px)/1.2 var(--body); }
.rest p { margin: 0; font: 500 clamp(16px, 3vh, 28px)/1.5 var(--body); opacity: .8; }
/* Bedtime: only stories, as sound. Three big story cards to pick from. */
.rest.story { justify-content: flex-start; padding-top: 3vh; gap: 1.5vh; }
.rest.story .scene { height: min(30vh, 40vw); }
.rest.story .scene * { animation: none !important; }
.stories { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 3vw, 32px); margin-top: 1vh; }
.stories button { width: clamp(150px, 26vw, 340px); aspect-ratio: 16 / 9; border-radius: 22px; border: 5px solid #ffe08a; padding: 0; position: relative;
  background: #26366a center/cover no-repeat; box-shadow: 0 8px 0 rgba(0, 0, 0, .35); cursor: pointer; }
.stories button:focus, .stories button:hover { outline: 6px solid #fff; outline-offset: 4px; transform: scale(1.04); }
.stories button svg { position: absolute; left: 50%; top: 50%; width: 34%; height: auto; transform: translate(-50%, -50%); }
.storycover { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
  background: radial-gradient(ellipse at 50% 0%, #2c3f80 0%, #14204a 55%, #0b1230 100%); }
.storycover .pic { width: min(60vw, 60vh); }
.storycover .pic svg { width: 100%; height: auto; display: block; overflow: visible; }
.storycover .pic * { animation: none !important; }
.home.resting .top, .home.resting .grid { display: none !important; }
.rest .tw { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
.rest .float { animation: bob 3.4s ease-in-out infinite; }
.rest .spin { animation: spin 30s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Night theme: from 7 in the evening to 7 in the morning the app turns dark and calm, with stars. */
body.night { --sky: #14204a; --ink: #eef2ff; --card: #26366a; --shade: rgba(0, 0, 0, .35);
  background: radial-gradient(ellipse at 50% 0%, #26397a 0%, #14204a 55%, #0b1230 100%) fixed; color-scheme: dark; }
body.night::before { content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 0; opacity: .7;
  background-image: radial-gradient(2px 2px at 8% 12%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 22% 40%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 35% 8%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 48% 22%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 63% 6%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 77% 30%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 14%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 14% 78%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 56% 88%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 86% 70%, #fff 50%, transparent 51%); }
body.night .home { position: relative; z-index: 1; }

/* Player screen */
.stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #0d1426; display: grid; grid-template-rows: 1fr auto; z-index: 5; }
.frame { position: relative; overflow: hidden; }
.frame > div, .frame iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; }
/* The video itself also plays with softer colours. */
.frame iframe, #player { filter: saturate(.5); }
/* Shield: stops every tap from reaching YouTube (no titles, logos, or suggested videos can be opened). */
.shield { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; }
.cover {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 3; display: grid; place-items: center;
  background: #0d1426 center/cover no-repeat;
}
.cover::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(13, 20, 38, .45); }
.bigbtn {
  position: relative; width: 132px; height: 132px; border-radius: 50%; background: var(--sun);
  display: grid; place-items: center; box-shadow: 0 8px 0 rgba(0,0,0,.25);
}
.bigbtn svg { width: 64px; height: 64px; fill: var(--ink); }
/* Next video: a ring around the play button empties over 4 seconds, then it plays. */
.bigbtn.next { overflow: visible; }
.bigbtn .count { position: absolute; top: -14px; right: -14px; bottom: -14px; left: -14px; width: calc(100% + 28px); height: calc(100% + 28px); transform: rotate(-90deg); fill: none; }
.bigbtn .count circle { stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 402; animation: countdown 4s linear forwards; }
@keyframes countdown { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 402; } }
.bar {
  display: flex; justify-content: center; align-items: center; gap: clamp(16px, 5vw, 48px); direction: ltr;
  padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.round { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
.round svg { width: 36px; height: 36px; fill: #fff; }
.home-btn { background: var(--tomato); }
.rotate-btn { background: #2f7fe0; }
.restart-btn { background: var(--sun); }
.restart-btn svg { fill: var(--ink); }
.rotate-btn svg { transition: transform .3s; }
/* Rotate button: turns the whole player a quarter turn, for watching lying on one side. */
.stage.r90, .stage.r270 { top: auto; right: auto; bottom: auto; left: auto; top: 50%; left: 50%; width: 100vh; height: 100vw; width: 100dvh; height: 100dvw; }
.stage.r90 { transform: translate(-50%, -50%) rotate(90deg); }
.stage.r180 { transform: rotate(180deg); }
.stage.r270 { transform: translate(-50%, -50%) rotate(270deg); }
.play-btn { background: var(--leaf); }
.msg { position: relative; color: #fff; font-family: var(--body); font-weight: 700; font-size: 22px; text-align: center; padding: 0 20px; }
.done { display: grid; gap: 22px; justify-items: center; }
/* Time is up: an alarm clock rings, then the slide (break) or moon (day over) pops in. */
.ring { position: relative; font-size: clamp(120px, 26vmin, 200px); line-height: 1; transform-origin: 50% 30%; animation: ring .12s ease-in-out infinite alternate; }
.ring::before, .ring::after { content: ""; position: absolute; top: 18%; width: 22%; height: 40%; border: 6px solid #fff; border-radius: 50%; opacity: .8; animation: waves .5s ease-out infinite; }
.ring::before { left: -24%; border-color: transparent transparent transparent #fff; }
.ring::after { right: -24%; border-color: transparent #fff transparent transparent; }
@keyframes ring { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
@keyframes waves { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.3); } }
.okhint { font: 700 28px/1 var(--body); letter-spacing: 2px; opacity: .85; direction: ltr; }
.ring svg { width: clamp(140px, 30vmin, 230px); height: auto; display: block; }
.donescene { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; }
.donescene.break { background: linear-gradient(#8fd3ff, #d9f2ff 62%, #bfe8ad); }
.donescene.tomorrow { background: radial-gradient(ellipse at 50% 0%, #2c3f80 0%, #14204a 55%, #0b1230 100%); }
.donescene .pop { width: min(64vw, 70vh); }
.donescene .pop svg { width: 100%; height: auto; display: block; overflow: visible; }
.donescene.break .msg { color: #1d2b4f; }
.donescene .msg { font-size: clamp(26px, 6vh, 54px); }
.pop { font-size: clamp(110px, 24vmin, 180px); line-height: 1; animation: pop .7s cubic-bezier(.3, 1.6, .5, 1) both, bob 2.4s ease-in-out .7s infinite; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

<script>

save("deviceLabel", deviceLabel());
const syncBody = (extra) => JSON.stringify({ device, label: deviceLabel(), resetSeen, data: mine, ...extra });
/* Where each video was left, newest wins across devices; start a little earlier. */
function resumeAt(id) {
  const a = (mine.pos || {})[id], b = ((others.pos || {})[id]);

combine();

    if (!game) { if (PICK_KINDS.some(gameOn)) showPicker(); else leaveGame(); }
    else if (!gameOn(game.kind)) leaveGame();

setInterval(liveNow, 5000);
/* A child's day runs from 7 in the morning to 7 the next morning (not

const DAY_START_HOUR = 7;
const kidNow = () => new Date(Date.now() - DAY_START_HOUR * 3600000);

  const d = kidNow(); d.setDate(d.getDate() - offset);

}

/* vwatch: seconds per video per day, for the parents' page. All stores keep 31 days. */

  const keep = new Set(Array.from({ length: 31 }, (_, i) => dayKey(i)));

function addSecond(catKey, videoId) {
  bump(mine.watch, catKey); bump(mine.vwatch, videoId);
  bump(watch, catKey); bump(vwatch, videoId);
  save("watch", JSON.stringify(mine.watch));
  save("vwatch", JSON.stringify(mine.vwatch));
}

const showOf = (key) => data.categories.find((c) => c.key === key);

/* One list a day, picked by score (settings in data.daily). The score uses

  // shared by all the videos of its show (a show of 8 episodes and one of 200 count the same).
  const perShowCount = {};
  for (const v of pool) perShowCount[v.show] = (perShowCount[v.show] || 0) + 1;
  let cands = pool.map((v) => ({ v, w: score(v) * fit(v) / perShowCount[v.show] })).filter((x) => x.w > 0);
  const perShow = {}, list = [], got = { exciting: 0, fantasy: 0, learn: 0, calm: 0, topic: 0 };
  const today = only || topicOfDay(), inTopic = new Set(today ? today.videos.map((v) => v.id) : []);
  const note = (v) => { // count a chosen video in the day's mix and in its show's share
    const t = traitsOf(v);

    if (t.real <= 2) got.fantasy++;
    if (t.learn >= 4) got.learn++;
    if (t.calm >= 4) got.calm++;
    if (inTopic.has(v.id)) { got.topic++; v.topic = today.icon; }
    perShow[v.show] = (perShow[v.show] || 0) + 1;
    const cap = (s) => (showOf(s).limit ? (k.perLessShow || 1) : (k.perShow || 2));

  // under its time limit it always gets at least one place, somewhere in the first ten.

    const its = cands.filter((x) => x.v.show === c.key);

    let r = rnd() * its.reduce((a, x) => a + x.w, 0), pick = its[its.length - 1];

    const wantTopic = got.topic < (k.topicPerDay ?? 4);
    let ws = cands.map((x) => x.w * balance(x.v, got, size - list.length));
    // Until the topic has its share, draw only from the topic's videos (when any fit).
    if (wantTopic && cands.some((x, i) => ws[i] > 0 && inTopic.has(x.v.id))) ws = ws.map((w, i) => (inTopic.has(cands[i].v.id) ? w : 0));

    note(v);
  }
  for (const v of must) list.splice(Math.floor(rnd() * Math.min(10, list.length + 1)), 0, v);
  return list;
}

}
$("gameHome").onclick = leaveGame;
document.querySelectorAll(".keys .k").forEach((k) => k.onclick = () => gameColor(k.classList[1]));
function onColor(c) {
  if (window.bookColor && window.bookColor(c)) return;
  if (!$("game").hidden) return gameColor(c);
  const press = (b) => { if (b && focusables().includes(b)) b.click(); };
  if ($("stage").hidden && $("storyList").children.length) { // bedtime: red/green move between the stories, yellow plays
    const list = [...$("storyList").children];
    let at = list.indexOf(document.activeElement);
    if (c === "yellow") { (list[at] || list[0]).click(); return; }
    at = Math.max(0, Math.min(list.length - 1, at < 0 ? 0 : at + (c === "red" ? -1 : c === "green" ? 1 : 0)));
    list[at].focus({ preventScroll: true });
    return;
  }
  if ($("stage").hidden) {
    if (c === "red") stepRow(-1);
    else if (c === "green") stepRow(1);
    else if (c === "yellow") {
      const tiles = [...$("grid").children];
      const b = tiles.includes(document.activeElement) ? document.activeElement : tiles.includes(framed) ? framed : null;
      if (b) b.click(); else stepRow(0);
    }
    return;
  }
  const cover = $("cover");
  const coverYellow = !cover.hidden && cover.querySelector(".bigbtn:not(#backBtn)");
  const coverRed = !cover.hidden && cover.querySelector("#backBtn");
  if (c === "red") press(coverRed || $("homeBtn"));
  else if (c === "yellow") press(coverYellow || $("restartBtn"));
  else if (c === "green") press($("playBtn"));
  else if (c === "blue") press($("rotateBtn"));
}
document.addEventListener("keydown", (e) => {
  if (window.bookKey && window.bookKey(e.key)) { e.preventDefault(); return; } // Noyan's own stories (mystory.js)
  const color = COLOR_KEYS[e.keyCode] || COLOR_KEYS[e.key];
  if (color) { e.preventDefault(); onColor(color); return; }
  if (e.key.startsWith("Arrow")) { e.preventDefault(); if (!$("game").hidden && window.gameArrow && window.gameArrow(e.key)) return; moveFocus(e.key); return; }
  const onStage = !$("stage").hidden;
  if (BACK_KEYS.has(e.key) || BACK_CODES.has(e.keyCode)) {
    if (!$("game").hidden) { e.preventDefault(); leaveGame(); return; }
    if (onStage) { e.preventDefault(); goHome(); }
    return;
  }
  if (onStage && ["MediaPlayPause", "MediaPlay", "MediaPause", " "].includes(e.key)) { e.preventDefault(); $("playBtn").click(); return; }
  if ((e.key === "Enter" || e.keyCode === 13) && !focusables().includes(document.activeElement)) {
    e.preventDefault(); // OK with nothing picked: pick the first thing
    if (onStage) $("playBtn").click(); else moveFocus("ArrowDown");
  }
});

/* Fill the whole screen on the first touch or key press (browsers only allow it after one).
   An installed app already opens full screen. */
const installed = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
function goFull() {
  if (PREVIEW) return;
  const el = document.documentElement;
  if (installed || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
}
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#parentsBtn")) goFull(); });
document.addEventListener("keydown", goFull);

/* Works offline after the first visit and can be installed like an app. */
if ("serviceWorker" in navigator && !PREVIEW) navigator.serviceWorker.register("sw.js").catch(() => {});
// Parents' page: hold the small lock for 2 seconds.
{
  const pb = $("parentsBtn"); let hold = null;
  const start = (e) => { e.preventDefault(); pb.classList.add("holding"); hold = setTimeout(() => { location.href = "parents.html"; }, 2000); };
  const stop = () => { pb.classList.remove("holding"); clearTimeout(hold); };
  pb.addEventListener("pointerdown", start);
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) pb.addEventListener(ev, stop);
}
// A new day can unlock a show: refresh the list when the app comes back to the screen.
// Leaving the app sends this device's counts; coming back fetches the other devices'.
function refreshHome() {
  if ($("home").hidden || !data.categories.length) return;
  if (timeState().mode !== lastMode) renderGrid(); else renderBudget();
}
document.addEventListener("visibilitychange", () => {
  logAction(document.hidden ? "hide" : "show");
  if (document.hidden) {
    if (API && NT.token()) try { fetch(API, { method: "POST", keepalive: true, headers: NT.headers(), body: syncBody() }); } catch (e) {}
  } else if (!$("home").hidden) { renderGrid(); sync().then(refreshHome); }
});
// Every 30 seconds: share counts with the other devices and notice when a break ends.
setInterval(() => { sync().then(refreshHome); }, 30000);

logAction("app", { ua: navigator.userAgent.slice(0, 200), size: innerWidth + "x" + innerHeight });
/* Not logged in yet: show a QR code. A parent scans it with the phone, logs
   in and approves; this device then gets its own login and the app starts. */
let pairTimer = null;
async function showPair() {
  clearTimeout(pairTimer);
  for (const id of ["home", "stage", "game"]) $(id).hidden = true;
  $("pair").hidden = false;
  const r = await NT.call("/pair/new");
  if (!r.ok || !r.body) { $("pairCode").textContent = "…"; pairTimer = setTimeout(showPair, 5000); return; }
  const link = location.origin + "/?c=" + r.body.code; // short, so it fits the small QR code
  $("pairQr").innerHTML = qrSvg(link);
  $("pairCode").textContent = r.body.code;
  $("pairLink").href = "account.html?back=app";
  const wait = async () => {
    if ($("pair").hidden) return;
    const w = await NT.call("/pair/wait", { pair: r.body.pair });
    if (w.body && w.body.status === "ok") { NT.setToken(w.body.token); location.reload(); }
    else if (w.body && w.body.status === "expired") showPair();
    else pairTimer = setTimeout(wait, 2000);
  };
  pairTimer = setTimeout(wait, 2000);
}
NT.onLogout = showPair;

// A parent's own phone gets a "parents" button at the top (the report asks for the 4-digit code).
if (API && NT.token()) NT.call("/me").then((r) => { if (r.ok && r.body && r.body.kind === "parent") $("parentsTop").hidden = false; });
if (API && !NT.token()) showPair();
else Promise.all([fetch("videos.json", { cache: "no-cache" }).then((r) => r.json()), sync()]).then(([d]) => {
  data = d;
  renderGrid();
});
</script>
