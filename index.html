<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Vazirmatn:wght@500;700&display=swap">
<style>
/* Layout: big show buttons on top, a grid of large thumbnails below; the player covers the whole screen. */
:root {
  --sky: #dcf2d8;
  --ink: #1d2b4f;
  --sun: #ffc93c;
  --tomato: #ff6b5b;
  --leaf: #3bb273;
  --card: #ffffff;
  --shade: rgba(29, 43, 79, .12);
  --display: "Fredoka", "Vazirmatn", system-ui, sans-serif;
  --body: "Vazirmatn", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 6px solid var(--tomato); outline-offset: 4px; }
/* TV remote: the picked picture grows and gets a thick yellow ring. */
.video:focus-visible, .video:focus { outline: 8px solid var(--sun); outline-offset: 5px; transform: scale(1.03); transition: transform .15s; z-index: 1; }

.home {
  margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding-block: max(14px, env(safe-area-inset-top)) 18px;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
}
.home > .grid { align-self: stretch; }
.parents {
  position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: 40px; height: 40px; border-radius: 50%; opacity: .35; display: grid; place-items: center;
  touch-action: none;
}
.parents svg { width: 20px; height: 20px; fill: var(--ink); }
.parents.holding { opacity: 1; background: var(--sun); transition: background 2s; }

/* One horizontal row of pictures that scrolls sideways (finger or remote). */
/* The videos: one big list, one under the other, that scrolls up and down
   (finger or remote). Room around every picture so the yellow frame never
   gets cut off, and space between the pictures. */
.grid { display: flex; flex-direction: column; align-items: center; gap: 40px; direction: ltr; overflow-y: auto; overflow-x: hidden;
  position: relative; height: var(--listh, 60vh); padding: 30px 40px 40px; scrollbar-width: none; }
.grid::-webkit-scrollbar { display: none; }
.grid .video { flex: 0 0 auto; width: var(--tile, 100%); }
/* TV and big screens: the big clock on the left half, the list on the right. */
.home.fit { direction: ltr; grid-template-columns: var(--clockcol, 40vw) minmax(0, 1fr); grid-template-rows: 1fr auto; column-gap: 24px;
  align-items: center; padding-block: 16px; }
.home.fit .top { grid-column: 1; grid-row: 1; justify-content: center; }
.home.fit .clock { grid-template-columns: auto; justify-items: center; row-gap: 18px; }
.home.fit .bigclock { grid-row: auto; }
.home.fit .tracks { align-self: auto; gap: 14px; }
.home.fit .track { width: calc(var(--clock) * .13); height: calc(var(--clock) * .13); }
.home.fit .grid { grid-column: 2; grid-row: 1; }
.home.fit .rest { grid-column: 2; grid-row: 1; direction: rtl; }

/* TV remote: each picture shows its number, so pressing that number on the remote opens it. */
.video .num { position: absolute; top: 8px; left: 8px; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 22px;
  background: rgba(29, 43, 79, .82); color: #fff; font: 700 26px/44px var(--body); text-align: center; display: none; }
.numbers .video .num { display: block; }
/* Topic of the day, in a corner: its picture (the same one as on its videos) and its name for the parents. */
.today-topic { justify-self: start; margin: 0; display: inline-flex; align-items: center; gap: 8px; background: var(--card);
  border-radius: 99px; padding: 4px 16px 4px 10px; box-shadow: 0 4px 0 var(--shade); font: 700 17px/1.4 var(--body); }
.today-topic b { font-size: 32px; line-height: 1; }
/* A new page slides in from the side the child pressed. */
.grid.slide-l { animation: slideL .35s ease-out; }
.grid.slide-r { animation: slideR .35s ease-out; }
@keyframes slideL { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.video .topic { position: absolute; top: 6px; right: 8px; font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.video.picked { outline: 8px solid var(--sun); outline-offset: 4px; }
.video {
  position: relative;
  display: block; background: var(--card); border-radius: 24px; overflow: hidden; padding: 0;
  box-shadow: 0 6px 0 var(--shade); border: 5px solid var(--card); transition: transform .12s;
}
.video:active { transform: scale(.97); }
.video img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--shade); }
.video img { border-radius: 19px; }
/* Pictures are shown with weak colours, so the brightest thumbnail does not win the child's choice. */
.video img { filter: saturate(.5); }

/* Home screen: the time clock (on TV a big one on the left, on phones on
   top) and the list of big videos. Sizes (--clock, --tile, --listh) are
   worked out from the screen in fitGrid(). */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top .today-topic { display: none !important; } /* the parents asked for no topic label at the top */
.top { justify-content: flex-end; }
/* The clock: its coloured slice is the time left in this turn and its hand
   ticks every second, so it is clear it is alive. Small circles beside it
   show all of today's turns. */
.clock { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 6px; align-items: center; direction: ltr; }
/* Christmas clock, drawn as SVG so older TV browsers show it too: a
   red-and-white candy-cane ring, a green slice for the time left on a snowy
   face, a gold star on top and a red hand. */
.bigclock { grid-row: 1 / span 2; position: relative; width: var(--clock, 92px); height: var(--clock, 92px); border-radius: 50%;
  box-shadow: 0 6px 0 var(--shade);
  margin: calc(var(--clock, 92px) * .16) calc(var(--clock, 92px) * .04) calc(var(--clock, 92px) * .04); } /* room for the star */
.bigclock .face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.bigclock .star { position: absolute; left: 50%; top: calc(var(--clock, 92px) * -.15); width: calc(var(--clock, 92px) * .22);
  height: calc(var(--clock, 92px) * .22); margin-left: calc(var(--clock, 92px) * -.11); }

.bigclock .hand { position: absolute; left: calc(50% - var(--clock, 92px) * .022); top: 14%; width: calc(var(--clock, 92px) * .044); height: 36%;
  border-radius: 99px; background: #a4161a; transform-origin: 50% 100%; animation: tick 60s steps(60) infinite; }
.bigclock.still .hand { animation-play-state: paused; opacity: .35; }
.bigclock .dot { position: absolute; left: calc(50% - var(--clock, 92px) * .07); top: calc(50% - var(--clock, 92px) * .07);
  width: calc(var(--clock, 92px) * .14); height: calc(var(--clock, 92px) * .14); border-radius: 50%; background: #f4c430;
  box-shadow: 0 0 0 calc(var(--clock, 92px) * .02) #a4161a; }
/* Balloon game: balloons in the four remote colours float up a blue sky;
   pressing a colour key (or tapping a balloon or a dot) pops one of that colour. */
.game { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 6; background: linear-gradient(#8fd3ff, #d9f2ff 70%, #c9ecc0); overflow: hidden; }
.sky { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.balloon { position: absolute; top: 0; width: var(--bw); height: calc(var(--bw) * 1.22); border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%;
  background-image: radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0, rgba(255,255,255,.75) 9%, rgba(255,255,255,0) 10%);
  box-shadow: inset -8px -10px 0 rgba(0,0,0,.12); cursor: pointer; }
.balloon::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--bw) * -.55); width: 2px; height: calc(var(--bw) * .55); background: rgba(29,43,79,.45); }
.balloon::before { content: ""; position: absolute; left: calc(50% - 7px); bottom: -8px; border: 7px solid transparent; border-bottom: 10px solid var(--col); transform: rotate(180deg); }
.balloon.pop { animation: pop .28s ease-out forwards; pointer-events: none; }
@keyframes pop { to { transform: scale(1.6); opacity: 0; } }
.bit { position: absolute; width: 14px; height: 14px; border-radius: 3px; animation: bit .8s ease-out forwards; pointer-events: none; }
@keyframes bit { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }
.keys { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 26px; direction: ltr; }
.keys .k { display: block; width: 64px; height: 64px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); cursor: pointer; }
.k.red { background: #e63946; } .k.green { background: #2a9d4b; } .k.yellow { background: #f6c90e; } .k.blue { background: #2f7fe0; }
.gamehome { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; }
.game .done { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; align-content: center; }
.video.gamecard { display: flex; align-items: center; justify-content: center; height: calc(var(--tile, 300px) * .5625);
  background: #bfe6ff; background-image: linear-gradient(#8fd3ff, #d9f2ff); font-size: calc(var(--tile, 300px) * .2); }
@keyframes tick { to { transform: rotate(360deg); } }
.tracks { align-self: end; display: flex; align-items: center; gap: 8px; }
.track { width: calc(var(--clock, 92px) * .24); height: calc(var(--clock, 92px) * .24); border-radius: 50%; border: 3px solid var(--card);
  box-shadow: 0 3px 0 var(--shade); background: #1e9b4f; }
.track.spent { background: #dfe7f0; }
.track.now { outline: 3px solid var(--ink); outline-offset: 1px; }
.track.low { background: #f4b400; }
.track.last { background: #d62839; }
.track.waiting { opacity: .45; }
.left-text { align-self: start; margin: 0; direction: rtl; font-size: clamp(13px, calc(var(--clock, 92px) * .1), 22px); opacity: .7; }
.top .today-topic { font-size: clamp(16px, calc(var(--clock, 92px) * .13), 28px); }
.top .today-topic b { font-size: 1.8em; }
/* Number and topic badges grow and shrink with the pictures. */
.video .num { min-width: clamp(26px, calc(var(--tile, 300px) * .1), 56px) !important; height: clamp(26px, calc(var(--tile, 300px) * .1), 56px) !important;
  line-height: clamp(26px, calc(var(--tile, 300px) * .1), 56px) !important; font-size: clamp(15px, calc(var(--tile, 300px) * .06), 32px) !important; border-radius: 99px; }
.video .topic { font-size: clamp(22px, calc(var(--tile, 300px) * .08), 52px) !important; }
.rest { display: grid; justify-items: center; gap: 12px; padding-block: 12vh; text-align: center; }
.rest .moon { font-size: clamp(110px, 22vw, 180px); line-height: 1; animation: bob 2.4s ease-in-out infinite; }
.rest p { margin: 0; font-family: var(--body); font-weight: 700; font-size: 20px; opacity: .75; }

/* Player screen */
.stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #0d1426; display: grid; grid-template-rows: 1fr auto; z-index: 5; }
.frame { position: relative; overflow: hidden; }
.frame > div, .frame iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; }
/* The video itself also plays with softer colours. */
.frame iframe, #player { filter: saturate(.5); }
/* Shield: stops every tap from reaching YouTube (no titles, logos, or suggested videos can be opened). */
.shield { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; }
.cover {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 3; display: grid; place-items: center;
  background: #0d1426 center/cover no-repeat;
}
.cover::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(13, 20, 38, .45); }
.bigbtn {
  position: relative; width: 132px; height: 132px; border-radius: 50%; background: var(--sun);
  display: grid; place-items: center; box-shadow: 0 8px 0 rgba(0,0,0,.25);
}
.bigbtn svg { width: 64px; height: 64px; fill: var(--ink); }
/* Next video: a ring around the play button empties over 4 seconds, then it plays. */
.bigbtn.next { overflow: visible; }
.bigbtn .count { position: absolute; top: -14px; right: -14px; bottom: -14px; left: -14px; width: calc(100% + 28px); height: calc(100% + 28px); transform: rotate(-90deg); fill: none; }
.bigbtn .count circle { stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 402; animation: countdown 4s linear forwards; }
@keyframes countdown { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 402; } }
.bar {
  display: flex; justify-content: center; align-items: center; gap: clamp(16px, 5vw, 48px); direction: ltr;
  padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.round { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
.round svg { width: 36px; height: 36px; fill: #fff; }
.home-btn { background: var(--tomato); }
.rotate-btn { background: #2f7fe0; }
.restart-btn { background: var(--sun); }
.restart-btn svg { fill: var(--ink); }
.rotate-btn svg { transition: transform .3s; }
/* Rotate button: turns the whole player a quarter turn, for watching lying on one side. */
.stage.r90, .stage.r270 { top: auto; right: auto; bottom: auto; left: auto; top: 50%; left: 50%; width: 100vh; height: 100vw; width: 100dvh; height: 100dvw; }
.stage.r90 { transform: translate(-50%, -50%) rotate(90deg); }
.stage.r180 { transform: rotate(180deg); }
.stage.r270 { transform: translate(-50%, -50%) rotate(270deg); }
.play-btn { background: var(--leaf); }
.msg { position: relative; color: #fff; font-family: var(--body); font-weight: 700; font-size: 22px; text-align: center; padding: 0 20px; }
.done { display: grid; gap: 22px; justify-items: center; }
/* Time is up: an alarm clock rings, then the slide (break) or moon (day over) pops in. */
.ring { position: relative; font-size: clamp(120px, 26vmin, 200px); line-height: 1; transform-origin: 50% 30%; animation: ring .12s ease-in-out infinite alternate; }
.ring::before, .ring::after { content: ""; position: absolute; top: 18%; width: 22%; height: 40%; border: 6px solid #fff; border-radius: 50%; opacity: .8; animation: waves .5s ease-out infinite; }
.ring::before { left: -24%; border-color: transparent transparent transparent #fff; }
.ring::after { right: -24%; border-color: transparent #fff transparent transparent; }
@keyframes ring { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
@keyframes waves { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.3); } }
.pop { font-size: clamp(110px, 24vmin, 180px); line-height: 1; animation: pop .7s cubic-bezier(.3, 1.6, .5, 1) both, bob 2.4s ease-in-out .7s infinite; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.done .msg.small { font-size: 18px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .ring, .ring::before, .ring::after, .pop, .rest .moon { animation: none !important; } }
</style>
</head>
<body>

<main class="home" id="home">
  <div class="top">
    <p class="today-topic" id="todayTopic" hidden></p>
    <div class="clock">
      <div class="bigclock" id="bigClock" aria-hidden="true">
        <svg class="face" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="50" fill="#fff"/>
          <circle cx="50" cy="50" r="45.5" fill="none" stroke="#d62839" stroke-width="8" stroke-dasharray="7.147 7.147"/>
          <circle cx="50" cy="50" r="40" fill="#fff8ee" stroke="#fff" stroke-width="3"/>
          <path id="clockSlice" fill="#1e9b4f" d=""/>
        </svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2l3 6.9 7.5.6-5.7 4.9 1.8 7.3L12 17.8 5.4 21.7l1.8-7.3L1.5 9.5 9 8.9z" fill="#f6c90e" stroke="#d99a00" stroke-width="1"/></svg>
        <i class="hand"></i><i class="dot"></i>
      </div>
      <div class="tracks" id="tracks" role="img" aria-label="Watching time left today"></div>
      <p class="left-text" id="leftText"></p>
    </div>
  </div>
  <section class="grid" id="grid" aria-live="polite"></section>
  <section class="rest" id="rest" hidden><div class="moon" id="restIcon" aria-hidden="true">🌙</div><p id="restText">برای امروز بس است. فردا دوباره.</p></section>
</main>

<button class="parents" id="parentsBtn" aria-label="Parents: hold for 2 seconds"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3z"/></svg></button>

<section class="game" id="game" hidden aria-label="Balloon game">
  <div class="sky" id="sky"></div>
  <div class="keys" aria-hidden="true"><i class="k red"></i><i class="k green"></i><i class="k yellow"></i><i class="k blue"></i></div>
  <button class="round home-btn gamehome" id="gameHome" aria-label="Back to videos"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
</section>
<section class="stage" id="stage" hidden>
  <div class="frame">
    <div id="player"></div>
    <div class="shield" id="shield"></div>
    <div class="cover" id="cover"></div>
  </div>
  <div class="bar">
    <button class="round home-btn" id="homeBtn" aria-label="Back to videos"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
    <button class="round play-btn" id="playBtn" aria-label="Play or pause"></button>
    <button class="round restart-btn" id="restartBtn" aria-label="Start from the beginning"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
    <button class="round rotate-btn" id="rotateBtn" aria-label="Turn the picture"><svg viewBox="0 0 24 24"><path d="M12 4V1L7 5l5 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  </div>
</section>

<script>
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  again: '<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>',
};
const END_TRIM = 2; // seconds: stop just before the very end (the shield already blocks taps on end-screen tiles)
const $ = (id) => document.getElementById(id);
const thumb = (id, q = "hqdefault") => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
let data = { categories: [] }, player = null, apiReady = false, tick = null;
let playingCat = null, playingId = null, locked = false, pending = null;

/* Design preview (index.html?preview, shown inside preview.html): the app runs
   with its own empty memory, never touches this browser's saved data and never
   talks to the server, so looking at designs cannot change Noyan's time. */
const PREVIEW = new URLSearchParams(location.search).has("preview");
const memory = new Map();
function save(k, v) { if (PREVIEW) { memory.set(k, v); return; } try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { if (PREVIEW) return memory.has(k) ? memory.get(k) : null; try { return localStorage.getItem(k); } catch (e) { return null; } }

/* Watch time, per show per local day, in seconds. Each device keeps its own
   counts (mine) and the server returns the sum of all other devices (others),
   so every phone and tablet shares one day. watch/vwatch = mine + others. */
// A copy opened on this computer for testing (localhost) never talks to the real
// server, so tests do not count toward Noyan's time or show in the report.
const LOCAL_TEST = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) || location.hostname.endsWith(".localhost");
// On our own addresses the stats server is on the same site; elsewhere (the
// GitHub copy) it is reached at ntv.financemind.com.
const OWN_HOSTS = ["noyantv.com", "ntv.financemind.com"];
const API = LOCAL_TEST || PREVIEW ? null : OWN_HOSTS.includes(location.hostname) ? location.origin + "/api/sync" : "https://ntv.financemind.com/api/sync";
function parse(k) { try { return JSON.parse(load(k) || "{}") || {}; } catch (e) { return {}; } }
const mine = { watch: parse("watch"), vwatch: parse("vwatch"), turnEnds: parse("turnEnds"), pos: parse("pos") };
/* Action log: every open, play, pause, home, end, time-up… with the time, the
   video and how long it was watched. Kept here until the server has it. */
let logQueue = [];
try { logQueue = JSON.parse(load("log") || "[]") || []; } catch (e) { logQueue = []; }
let sessionSecs = 0; // seconds watched since the video was opened
function logAction(a, extra) {
  const ev = { at: Date.now(), a };

  for (let j = 1; j <= list.length; j++) {
    const v = list[(i + j + list.length) % list.length], c = showOf(v.show);
    if (v.id !== playingId && !seenToday(v.id) && c && allowed(c)) return { v, c };
  }
  return null;
}
function finish() {
  logAction("end");
  savePos(playingId, 0); // next time it starts from the beginning
  locked = true; clearInterval(tick);
  player.pauseVideo();
  setPlayIcon(false);
  if (!canWatch()) return stopForToday();
  // Go on to the next video in today's list by itself, after a 4-second countdown.
  const next = nextVideo();
  if (next) {
    showCover(`<div class="done"><button class="bigbtn next" id="nextBtn" aria-label="Next video">${ICON.play}
      <svg class="count" viewBox="0 0 140 140"><circle cx="70" cy="70" r="64"/></svg></button>${homeButton("backBtn")}</div>`, thumb(next.v.id));
    const go = () => { clearTimeout(autoNext); if (!$("stage").hidden) openVideo(next.v, next.c); };
    autoNext = setTimeout(go, 4000);
    $("nextBtn").onclick = go;
    $("backBtn").onclick = () => { clearTimeout(autoNext); goHome(); };
    return;
  }
  showCover(`<div class="done"><div class="msg">تمام شد!</div>
    <div style="display:flex;gap:22px"><button class="bigbtn" id="againBtn" aria-label="Watch again">${ICON.again}</button>${homeButton("backBtn")}</div></div>`, null);
  $("againBtn").onclick = () => {
    if (!canWatch()) return stopForToday();
    if (playingCat && !allowed(playingCat)) return goHome();
    logAction("again"); sessionSecs = 0;
    locked = false; player.seekTo(0); player.playVideo();
  };
  $("backBtn").onclick = goHome;
}

function stopForToday() {
  logAction("timeup");
  locked = true; clearInterval(tick);
  player.pauseVideo();
  setPlayIcon(false);
  const brk = timeState().mode === "break";
  // A child can't read: first an alarm clock rings with a soft bell, then the
  // slide (go and play) or the moon (see you tomorrow) pops in with a little tune.
  showCover(`<div class="done"><div class="ring" aria-label="Time is up">⏰</div></div>`, null);
  timeUpSound();
  setTimeout(() => {
    if ($("stage").hidden) return;
    showCover(`<div class="done"><div class="pop">${brk ? "🛝" : "🌙"}</div><div class="msg small">${brk ? "وقت بازی! بعداً دوباره." : "برای امروز بس است. فردا دوباره."}</div>${homeButton("backBtn")}</div>`, null);
    $("backBtn").onclick = goHome;
  }, 2600);
}

/* Sounds are made in the browser (no files): a soft alarm-clock trill, then a
   happy music-box tune. Browsers allow sound only after a first touch or key,
   which the child has already given by starting the video. */
let audio = null;
function audioCtx() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch (e) { audio = null; }
  return audio;
}
document.addEventListener("pointerdown", audioCtx);
document.addEventListener("keydown", audioCtx);
function bell(a, freq, at, len, vol) {
  for (const [mult, v] of [[1, vol], [2.76, vol * 0.25]]) { // a bell has a bright overtone
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = freq * mult;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(v, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g); g.connect(a.destination);
    o.start(at); o.stop(at + len + 0.05);
  }
}
function timeUpSound() {
  const a = audioCtx();
  if (!a) return;
  const t = a.currentTime + 0.05;
  for (let r = 0; r < 3; r++) for (let i = 0; i < 8; i++) bell(a, i % 2 ? 1760 : 1480, t + r * 0.75 + i * 0.07, 0.18, 0.12); // ring-ring-ring
  [784, 988, 1175, 1568].forEach((f, i) => bell(a, f, t + 2.5 + i * 0.2, 1.2, 0.2)); // happy tune going up
}

function onErr(e) {
  logAction("error", { code: e && e.data });
  locked = true;
  showCover(`<div class="done"><div class="msg">این ویدیو باز نشد.</div>${homeButton("backBtn")}</div>`, null);
  $("backBtn").onclick = goHome;
}

function goHome() {
  clearTimeout(autoNext);
  if (!$("stage").hidden) logAction("home");
  clearInterval(tick);
  locked = true;
  if (player) player.stopVideo();
  $("stage").hidden = true;
  $("home").hidden = false;
  renderGrid();
}

$("homeBtn").onclick = goHome;
$("playBtn").onclick = () => {
  if (!player || locked) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) { logAction("pause"); pausedCover(); player.pauseVideo(); }
  else { logAction("play"); player.playVideo(); }
};
// Start over: the same video from the very beginning.
$("restartBtn").onclick = () => {
  if (!player || locked) return;
  logAction("restart");
  savePos(playingId, 0);
  player.seekTo(0, true); player.playVideo();
};
$("shield").onclick = () => $("playBtn").click();
/* Each press turns the player a quarter turn clockwise; this device remembers it. */
let turn = Number(load("rotate")) || 0;
function applyTurn() {
  $("stage").classList.remove("r90", "r180", "r270");
  if (turn) $("stage").classList.add("r" + turn);
}
applyTurn();
$("rotateBtn").onclick = () => { turn = (turn + 90) % 360; save("rotate", String(turn)); applyTurn(); logAction("rotate", { deg: turn }); };
document.addEventListener("contextmenu", (e) => e.preventDefault());

/* TV remote and keyboard: arrows move between buttons, OK presses, Back goes home. */
const BACK_KEYS = new Set(["Escape", "Backspace", "GoBack", "BrowserBack", "XF86Back"]);
const BACK_CODES = new Set([10009, 461, 8, 27]); // Tizen, webOS, others
function focusables() {
  return [...document.querySelectorAll("button")].filter((b) => {
    if (b.id === "parentsBtn" || b.disabled) return false; // the lock stays a touch-only thing
    const r = b.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(b).visibility !== "hidden";
  });
}
function moveFocus(dir) {
  const all = focusables();
  if (!all.length) return;
  const cur = document.activeElement;
  if (!all.includes(cur)) return all[0].focus();
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestD = Infinity;
  for (const b of all) {
    if (b === cur) continue;
    const r = b.getBoundingClientRect(), dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
    const ok = dir === "ArrowLeft" ? dx < -4 : dir === "ArrowRight" ? dx > 4 : dir === "ArrowUp" ? dy < -4 : dy > 4;
    if (!ok) continue;
    const along = dir === "ArrowLeft" || dir === "ArrowRight" ? Math.abs(dx) : Math.abs(dy);
    const across = dir === "ArrowLeft" || dir === "ArrowRight" ? Math.abs(dy) : Math.abs(dx);
    const d = along + across * 2;
    if (d < bestD) { bestD = d; best = b; }
  }
  if (best) { best.focus({ preventScroll: true }); centerTile(best); }
}
// Slide the row so the picked picture sits in the middle (other buttons: just make them visible).
function centerTile(b) {
  const grid = $("grid");
  if (b.parentElement !== grid) return b.scrollIntoView({ block: "nearest" });
  grid.scrollTo({ top: b.offsetTop - (grid.clientHeight - b.offsetHeight) / 2, behavior: "smooth" }); // the list is position: relative, so offsetTop is inside it
}
/* Some TV browsers move a mouse pointer with the remote's arrows instead of
   sending arrow keys. Then the yellow frame follows the pointer, and the big
   side arrows turn the page. */
document.addEventListener("mouseover", (e) => {
  const b = e.target.closest && e.target.closest("button");
  if (b && b !== document.activeElement && focusables().includes(b)) b.focus({ preventScroll: true });
});
/* TV mode (open the app once with ?tv, the TV then remembers it): for TV
   browsers whose remote arrows move a mouse pointer. After the first OK the
   pointer is hidden and held still (pointer lock); each push of an arrow
   moves the yellow frame one picture, and OK opens the framed picture. */
if (new URLSearchParams(location.search).has("tv")) save("tvMode", "1");
const TV_MODE = load("tvMode") === "1";
const STEP = Number(new URLSearchParams(location.search).get("tv")) || 40; // pointer pixels per jump
let push = { x: 0, y: 0 };
function lockPointer() {
  if (!TV_MODE || document.pointerLockElement) return;
  try { const p = document.documentElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
document.addEventListener("mousemove", (e) => {
  if (!TV_MODE || !document.pointerLockElement) return;
  push.x += e.movementX; push.y += e.movementY;
  if (Math.abs(push.x) >= STEP) { moveFocus(push.x > 0 ? "ArrowRight" : "ArrowLeft"); push = { x: 0, y: 0 }; }
  else if (Math.abs(push.y) >= STEP) { moveFocus(push.y > 0 ? "ArrowDown" : "ArrowUp"); push = { x: 0, y: 0 }; }
});
// Remember the framed button, and keep the frame when OK is pressed (a press
// would otherwise take the focus off the button before the click).
let framed = null;
document.addEventListener("focusin", (e) => { if (e.target.tagName === "BUTTON") framed = e.target; });
document.addEventListener("mousedown", (e) => { if (TV_MODE && document.pointerLockElement) e.preventDefault(); }, true);
document.addEventListener("click", (e) => {
  if (!TV_MODE || !e.isTrusted) return;
  if (!document.pointerLockElement) { lockPointer(); return; }
  // Locked: the click lands on the page, not on a picture; press the framed button instead.
  e.preventDefault(); e.stopPropagation();
  const b = document.activeElement && document.activeElement.tagName === "BUTTON" ? document.activeElement : framed;
  if (b && document.contains(b) && focusables().includes(b)) b.click(); else moveFocus("ArrowDown");
}, true);
// The side arrows move along the row one picture at a time.
function stepRow(step) {
  const tiles = [...$("grid").children];
  if (!tiles.length) return;
  let at = tiles.indexOf(document.activeElement);
  if (at < 0) at = tiles.indexOf(framed);
  const b = tiles[Math.max(0, Math.min(tiles.length - 1, at < 0 ? 0 : at + step))];
  b.focus({ preventScroll: true }); centerTile(b);
}
/* The four colour keys every TV remote has (red, green, yellow, blue, left
   to right). No screen needs more than these four, and each on-screen button
   has the colour of its key:
   - home:   red = previous picture, green = next picture, yellow = watch the framed one;
   - player: red = home, green = pause/play, yellow = from the start, blue = turn the picture;
   - the screens after a video: red = home, yellow = next video / again. */
const COLOR_KEYS = { 403: "red", 404: "green", 405: "yellow", 406: "blue",
  ColorF0Red: "red", ColorF1Green: "green", ColorF2Yellow: "yellow", ColorF3Blue: "blue" };
/* ---- Balloon game ---- */
const BALLOON = { red: "#e63946", green: "#2a9d4b", yellow: "#f6c90e", blue: "#2f7fe0" };
const GAME_POPS = 25, GAME_SECONDS = 180; // the game ends by itself after this many pops or seconds
let game = null;
function popSound(color) {
  const a = audioCtx();
  if (!a) return;
  const t = a.currentTime, base = { red: 523, green: 659, yellow: 784, blue: 988 }[color] || 660;
  bell(a, base, t, 0.35, 0.18); bell(a, base * 1.5, t + 0.08, 0.3, 0.12);
}
function spawnBalloon() {
  if (!game) return;
  const sky = $("sky"), colors = Object.keys(BALLOON);
  const color = colors[Math.floor(Math.random() * 4)];
  const bw = Math.round(Math.min(innerWidth, innerHeight) * 0.13 + 30);
  const el = document.createElement("div");
  el.className = "balloon"; el.dataset.color = color;
  el.style.setProperty("--col", BALLOON[color]); el.style.setProperty("--bw", bw + "px");
  el.style.backgroundColor = BALLOON[color]; el.style.width = bw + "px"; el.style.height = Math.round(bw * 1.22) + "px";
  const x = Math.random() * (innerWidth - bw - 40) + 20;
  el.style.left = x + "px";
  el.onclick = () => popBalloon(el);
  sky.appendChild(el);
  game.balloons.push({ el, y: innerHeight + 20, speed: innerHeight / (9 + Math.random() * 4), sway: Math.random() * 6.28, x });
}
function popBalloon(el) {
  if (!game || el.classList.contains("pop")) return;
  const color = el.dataset.color, r = el.getBoundingClientRect();
  el.classList.add("pop");
  popSound(color);
  for (let i = 0; i < 12; i++) { // a little burst of coloured bits
    const b = document.createElement("i");
    b.className = "bit";
    b.style.left = r.left + r.width / 2 + "px"; b.style.top = r.top + r.height / 2 + "px";
    b.style.background = [BALLOON[color], "#fff", "#ffd166"][i % 3];
    const ang = (i / 12) * 6.28, dist = 60 + Math.random() * 60;
    b.style.setProperty("--dx", Math.cos(ang) * dist + "px"); b.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    $("sky").appendChild(b);
    setTimeout(() => b.remove(), 900);
  }
  setTimeout(() => el.remove(), 300);
  game.balloons = game.balloons.filter((x) => x.el !== el);
  if (++game.pops >= GAME_POPS) endGame(true);
}
function popColor(color) { // the balloon of that colour that is highest up
  if (!game) return;
  const list = game.balloons.filter((b) => b.el.dataset.color === color).sort((a, b) => a.y - b.y);
  if (list.length) popBalloon(list[0].el);
}
function gameFrame(t) {
  if (!game) return;
  const dt = Math.min(0.05, (t - (game.last || t)) / 1000); game.last = t;
  for (const b of game.balloons) {
    b.y -= b.speed * dt; b.sway += dt * 1.4;
    b.el.style.transform = `translate(${Math.sin(b.sway) * 14}px, ${b.y}px)`;
    if (b.y < -300) { b.el.remove(); b.gone = true; }
  }
  game.balloons = game.balloons.filter((b) => !b.gone);
  game.raf = requestAnimationFrame(gameFrame);
}
function startGame() {
  if (!canWatch()) return renderGrid();
  playingId = null; playingCat = null;
  $("home").hidden = true; $("game").hidden = false;
  $("sky").innerHTML = "";
  game = { balloons: [], pops: 0, seconds: 0 };
  logAction("game");
  for (let i = 0; i < 3; i++) setTimeout(spawnBalloon, i * 500);
  game.spawn = setInterval(() => { if (game && game.balloons.length < 8) spawnBalloon(); }, 1300);
  // The game uses today's time like a video.
  game.clock = setInterval(() => {
    if (!game) return;
    addSecond("game", "game");
    if (++game.seconds >= GAME_SECONDS) return endGame(true);
    if (!canWatch()) { endGame(false); stopTimeUpGame(); }
  }, 1000);
  game.raf = requestAnimationFrame(gameFrame);
}
function stopTimeUpGame() { timeUpSound(); }
function endGame(cheer) {
  if (!game) return;
  clearInterval(game.spawn); clearInterval(game.clock); cancelAnimationFrame(game.raf);
  game = null;
  if (cheer) {
    $("sky").innerHTML = `<div class="done"><div class="pop">🎉</div></div>`;
    [784, 988, 1175, 1568].forEach((f, i) => { const a = audioCtx(); if (a) bell(a, f, a.currentTime + i * 0.18, 1, 0.18); });
    setTimeout(leaveGame, 2600);
  } else leaveGame();
}
function leaveGame() {
  if (game) endGame(false);
  $("game").hidden = true; $("home").hidden = false;
  renderGrid();
}
$("gameHome").onclick = leaveGame;
document.querySelectorAll(".keys .k").forEach((k) => k.onclick = () => popColor(k.classList[1]));
function onColor(c) {
  if (!$("game").hidden) return popColor(c);
  const press = (b) => { if (b && focusables().includes(b)) b.click(); };
  if ($("stage").hidden) {
    if (c === "red") stepRow(-1);
    else if (c === "green") stepRow(1);
    else if (c === "yellow") {
      const tiles = [...$("grid").children];
      const b = tiles.includes(document.activeElement) ? document.activeElement : tiles.includes(framed) ? framed : null;
      if (b) b.click(); else stepRow(0);
    }
    return;
  }
  const cover = $("cover");
  const coverYellow = !cover.hidden && cover.querySelector(".bigbtn:not(#backBtn)");
  const coverRed = !cover.hidden && cover.querySelector("#backBtn");
  if (c === "red") press(coverRed || $("homeBtn"));
  else if (c === "yellow") press(coverYellow || $("restartBtn"));
  else if (c === "green") press($("playBtn"));
  else if (c === "blue") press($("rotateBtn"));
}
document.addEventListener("keydown", (e) => {
  const color = COLOR_KEYS[e.keyCode] || COLOR_KEYS[e.key];
  if (color) { e.preventDefault(); onColor(color); return; }
  if (e.key.startsWith("Arrow")) { e.preventDefault(); moveFocus(e.key); return; }
  const onStage = !$("stage").hidden;
  if (BACK_KEYS.has(e.key) || BACK_CODES.has(e.keyCode)) {
    if (!$("game").hidden) { e.preventDefault(); leaveGame(); return; }
    if (onStage) { e.preventDefault(); goHome(); }
    return;
  }
  if (onStage && ["MediaPlayPause", "MediaPlay", "MediaPause", " "].includes(e.key)) { e.preventDefault(); $("playBtn").click(); return; }
  if ((e.key === "Enter" || e.keyCode === 13) && !focusables().includes(document.activeElement)) {
    e.preventDefault(); // OK with nothing picked: pick the first thing
    if (onStage) $("playBtn").click(); else moveFocus("ArrowDown");
  }
});

/* Fill the whole screen on the first touch or key press (browsers only allow it after one).
   An installed app already opens full screen. */
const installed = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
function goFull() {
  if (PREVIEW) return;
  const el = document.documentElement;
  if (installed || document.fullscreenElement || document.webkitFullscreenElement) return;
  try { (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
}
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#parentsBtn")) goFull(); });
document.addEventListener("keydown", goFull);

/* Works offline after the first visit and can be installed like an app. */
if ("serviceWorker" in navigator && !PREVIEW) navigator.serviceWorker.register("sw.js").catch(() => {});
// Parents' page: hold the small lock for 2 seconds.
{
  const pb = $("parentsBtn"); let hold = null;
  const start = (e) => { e.preventDefault(); pb.classList.add("holding"); hold = setTimeout(() => { location.href = "parents.html"; }, 2000); };
  const stop = () => { pb.classList.remove("holding"); clearTimeout(hold); };
  pb.addEventListener("pointerdown", start);
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) pb.addEventListener(ev, stop);
}
// A new day can unlock a show: refresh the list when the app comes back to the screen.
// Leaving the app sends this device's counts; coming back fetches the other devices'.
function refreshHome() {
  if ($("home").hidden || !data.categories.length) return;
  if (timeState().mode !== lastMode) renderGrid(); else renderBudget();
}
document.addEventListener("visibilitychange", () => {
  logAction(document.hidden ? "hide" : "show");
  if (document.hidden) {
    if (API) try { navigator.sendBeacon(API, new Blob([syncBody()], { type: "text/plain" })); } catch (e) {}
  } else if (!$("home").hidden) { renderGrid(); sync().then(refreshHome); }
});
// Every 30 seconds: share counts with the other devices and notice when a break ends.
setInterval(() => { sync().then(refreshHome); }, 30000);

logAction("app", { ua: navigator.userAgent.slice(0, 200), size: innerWidth + "x" + innerHeight });
Promise.all([fetch("videos.json", { cache: "no-cache" }).then((r) => r.json()), sync()]).then(([d]) => {
  data = d;
  renderGrid();
});
</script>
