<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf3f"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- rainbow behind the TV -->
  <g fill="none" stroke-width="22" stroke-linecap="round">
    <path d="M86 300 A170 170 0 0 1 426 300" stroke="#ff5d73"/>
    <path d="M108 300 A148 148 0 0 1 404 300" stroke="#ffd23f"/>
    <path d="M130 300 A126 126 0 0 1 382 300" stroke="#4cd884"/>
  </g>
  <!-- antennae -->
  <g stroke="#5b3a9e" stroke-width="12" stroke-linecap="round">
    <line x1="226" y1="190" x2="186" y2="132"/>
    <line x1="286" y1="190" x2="326" y2="132"/>
  </g>
  <circle cx="183" cy="127" r="17" fill="#ff5d73"/>
  <circle cx="329" cy="127" r="17" fill="#4cd884"/>
  <!-- TV body -->
  <rect x="122" y="182" width="268" height="206" rx="48" fill="url(#tv)" stroke="#5b3a9e" stroke-width="12"/>
  <rect x="152" y="210" width="208" height="150" rx="32" fill="#fff7e8"/>
  <!-- face -->
  <circle cx="214" cy="270" r="15" fill="#3b2a66"/>
  <circle cx="298" cy="270" r="15" fill="#3b2a66"/>
  <circle cx="219" cy="264" r="5" fill="#fff"/>
  <circle cx="303" cy="264" r="5" fill="#fff"/>
  <ellipse cx="186" cy="305" rx="16" ry="10" fill="#ff9bb0"/>
  <ellipse cx="326" cy="305" rx="16" ry="10" fill="#ff9bb0"/>
  <path d="M226 304 Q256 336 286 304" fill="none" stroke="#3b2a66" stroke-width="10" stroke-linecap="round"/>
  <!-- feet -->
  <rect x="170" y="384" width="34" height="26" rx="10" fill="#5b3a9e"/>
  <rect x="308" y="384" width="34" height="26" rx="10" fill="#5b3a9e"/>
</svg>
