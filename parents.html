<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>گزارش تماشا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Layout: one column; summary numbers first, then limited shows, the week, shows, and every video. */
:root {
  --bg: #f3f7fb;
  --ink: #1d2b4f;
  --muted: #5f6b86;
  --card: #ffffff;
  --line: #dde5ef;
  --bar: #4a6fd8;
  --ok: #2f9e63;
  --stop: #d9483b;
  --font: "Vazirmatn", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); }
.wrap {
  max-width: 860px; margin: 0 auto; display: grid; gap: 18px;
  padding-block: max(16px, env(safe-area-inset-top)) 48px;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
}
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 18px; margin: 0 0 10px; }
a.back { color: var(--bar); font-weight: 700; text-decoration: none; padding: 8px 14px; border: 2px solid var(--bar); border-radius: 12px; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
section { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--line); min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: grid; gap: 2px; }
.stat b { font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 14px; }
.limit { display: grid; gap: 6px; padding-block: 10px; border-top: 1px solid var(--line); }
.limit:first-of-type { border-top: 0; padding-top: 0; }
.limit-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; color: #fff; }
.pill.ok { background: var(--ok); }
.pill.stop { background: var(--stop); }
.limit small { color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 170px; }
.day { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 4px; text-align: center; font-size: 13px; }
.day .col { display: flex; align-items: flex-end; justify-content: center; }
.day .col i { width: 70%; max-width: 40px; background: var(--bar); border-radius: 6px 6px 0 0; min-height: 2px; }
.day span { color: var(--muted); }
.table { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.t { direction: ltr; text-align: left; min-width: 180px; }
.empty { color: var(--muted); }
@media (max-width: 520px) { .stat b { font-size: 21px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>گزارش تماشای نویان</h1>
    <a class="back" href="./">برگشت</a>
  </header>
  <p class="note">این گزارش فقط تماشای همین دستگاه را نشان می‌دهد. هر گوشی و تبلت گزارش خودش را دارد.</p>

  <section>
    <div class="stats">
      <div class="stat"><b id="sToday"></b><span id="sTodayLabel">امروز</span></div>
      <div class="stat"><b id="sYest"></b><span>دیروز</span></div>
      <div class="stat"><b id="sWeek"></b><span>۷ روز اخیر</span></div>
    </div>
  </section>

  <section>
    <h2>برنامه‌های محدود</h2>
    <div id="limits"></div>
  </section>

  <section>
    <h2>هر روز این هفته</h2>
    <div class="week" id="week"></div>
  </section>

  <section>
    <h2>هر برنامه</h2>
    <div class="table"><table>
      <thead><tr><th>برنامه</th><th>امروز</th><th>۷ روز</th><th>۳۰ روز</th></tr></thead>
      <tbody id="shows"></tbody>
    </table></div>
  </section>

  <section>
    <h2>هر ویدیو</h2>
    <div class="table"><table>
      <thead><tr><th>ویدیو</th><th>برنامه</th><th>امروز</th><th>۷ روز</th><th>۳۰ روز</th></tr></thead>
      <tbody id="videos"></tbody>
    </table></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
function read(k) { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
const watch = read("watch"), vwatch = read("vwatch");
const fa = (n) => n.toLocaleString("fa-IR");
function dayKey(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() - offset);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function sum(store, key, from, to) { // days offset from..to inclusive; key null = everything
  let s = 0;
  for (let i = from; i <= to; i++) {
    const day = store[dayKey(i)] || {};
    for (const [k, v] of Object.entries(day)) if (key === null || k === key) s += v;
  }
  return s;
}
function dur(sec) {
  const m = Math.round(sec / 60);
  if (sec > 0 && m === 0) return "کمتر از ۱ دقیقه";
  if (m < 60) return `${fa(m)} دقیقه`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${fa(h)} ساعت و ${fa(r)} دقیقه` : `${fa(h)} ساعت`;
}
function cell(text, cls) { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; return td; }
function emptyRow(tbody, cols, text) {
  const tr = document.createElement("tr"); const td = cell(text, "empty"); td.colSpan = cols; tr.appendChild(td); tbody.appendChild(tr);
}

fetch("videos.json", { cache: "no-cache" }).then((r) => r.json()).then((data) => {
  $("sToday").textContent = dur(sum(watch, null, 0, 0));
  const dly = data.daily || {}, turns = dly.turns || 2, tm = dly.turnMinutes || 30;
  const usedTurns = Math.min(turns, Math.floor(sum(watch, null, 0, 0) / (tm * 60)));
  $("sTodayLabel").textContent = `امروز (${fa(usedTurns)} از ${fa(turns)} نوبت ${fa(tm)} دقیقه‌ای تمام شده)`;
  $("sYest").textContent = dur(sum(watch, null, 1, 1));
  $("sWeek").textContent = dur(sum(watch, null, 0, 6));

  // Limited shows: same rule as the app.
  for (const c of data.categories.filter((x) => x.limit)) {
    const today = sum(watch, c.key, 0, 0), yest = sum(watch, c.key, 1, 1), week = sum(watch, c.key, 0, 6);
    const day = c.limit.day * 60, wk = c.limit.week * 60;
    let why = "";
    if (today >= day) why = "امروز به سقف روزانه رسید";
    else if (yest >= day) why = "دیروز به سقف روزانه رسید";
    else if (week >= wk) why = "به سقف هفتگی رسید";
    const box = document.createElement("div");
    box.className = "limit";
    box.innerHTML = `<div class="limit-head"><b></b><span class="pill ${why ? "stop" : "ok"}">${why ? "امروز پنهان است" : "در فهرست هست"}</span></div>
      <div>امروز ${dur(today)} از ${fa(c.limit.day)} دقیقه · هفته ${dur(week)} از ${fa(c.limit.week)} دقیقه</div>
      <small></small>`;
    box.querySelector("b").textContent = c.title;
    box.querySelector("small").textContent = why;
    $("limits").appendChild(box);
  }

  // The week, oldest day first (on the right, since the page is right to left).
  const totals = Array.from({ length: 7 }, (_, i) => sum(watch, null, 6 - i, 6 - i));
  const max = Math.max(60, ...totals);
  const names = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه"];
  totals.forEach((t, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const el = document.createElement("div");
    el.className = "day";
    el.innerHTML = `<span>${fa(Math.round(t / 60))}</span><div class="col"><i style="height:${(100 * t / max).toFixed(1)}%"></i></div><span>${i === 6 ? "امروز" : names[d.getDay()]}</span>`;
    $("week").appendChild(el);
  });

  // Shows.
  const showRows = data.categories.map((c) => [c.title, sum(watch, c.key, 0, 0), sum(watch, c.key, 0, 6), sum(watch, c.key, 0, 30)])
    .filter((r) => r[3] > 0).sort((a, b) => b[3] - a[3]);
  if (!showRows.length) emptyRow($("shows"), 4, "هنوز چیزی دیده نشده.");
  for (const r of showRows) {
    const tr = document.createElement("tr");
    tr.append(cell(r[0]), cell(dur(r[1]), "n"), cell(dur(r[2]), "n"), cell(dur(r[3]), "n"));
    $("shows").appendChild(tr);
  }

  // Videos, including ones no longer in the list.
  const info = {};
  const showTitle = {};
  for (const c of data.categories) { showTitle[c.key] = c.title; for (const v of c.videos) info[v.id] = { title: v.title, show: c.title }; }
  for (const tp of data.topics || []) for (const v of tp.videos) info[v.id] = info[v.id] || { title: v.title, show: showTitle[v.show] || "—" };
  const ids = new Set();
  for (const day of Object.values(vwatch)) for (const id of Object.keys(day)) ids.add(id);
  const rows = [...ids].map((id) => [id, sum(vwatch, id, 0, 0), sum(vwatch, id, 0, 6), sum(vwatch, id, 0, 30)])
    .filter((r) => r[3] > 0).sort((a, b) => b[3] - a[3]);
  if (!rows.length) emptyRow($("videos"), 5, "هنوز چیزی دیده نشده.");
  for (const [id, a, b, c] of rows) {
    const tr = document.createElement("tr");
    const v = info[id] || { title: "ویدیویی که دیگر در فهرست نیست", show: "—" };
    tr.append(cell(v.title, "t"), cell(v.show), cell(dur(a), "n"), cell(dur(b), "n"), cell(dur(c), "n"));
    $("videos").appendChild(tr);
  }
});
</script>
</body>
</html>
