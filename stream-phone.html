<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d2b4f">
<title>گوشی به‌جای کامپیوتر</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* Test: the phone is the game's computer and controller, the TV is only the
   screen. The game is drawn here on a 1280×720 canvas and sent to the TV as
   live video (WebRTC); the phone shows a small copy and two big buttons.
   A running clock is drawn in the picture and shown here too: a photo of both
   screens together shows how late the TV is. */
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
body { background: radial-gradient(ellipse at 50% 0%, #2c3f80, #14204a 70%); color: #fff; font: 16px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.status { text-align: center; font-size: 14px; opacity: .9; min-height: 2.6em; margin: 0; }
.status a { color: #ffd23f; }
.top { display: flex; gap: 10px; align-items: center; }
canvas { width: 46%; aspect-ratio: 16 / 9; border-radius: 10px; background: #000; flex: none; }
.side { flex: 1; display: grid; gap: 6px; min-width: 0; }
.clock { font: 700 26px/1 ui-monospace, monospace; direction: ltr; text-align: center; background: #000; border-radius: 10px; padding: 8px 4px; }
button.go { font: 700 17px/1 system-ui, sans-serif; border: 0; border-radius: 12px; padding: 12px; background: #f6c90e; color: #1d2b4f; }
button.go:disabled { opacity: .6; }
.pad { flex: 1; display: flex; gap: 14px; direction: ltr; }
.diag { margin: 0; font-size: 13px; background: rgba(0, 0, 0, .35); border-radius: 10px; padding: 8px 10px; white-space: pre-line; }
button.go2 { background: #fff; }
.opts { display: flex; gap: 6px; }
.opts select { flex: 1; min-width: 0; font: 14px system-ui, sans-serif; border-radius: 10px; border: 0; padding: 7px 4px; background: #fff; color: #1d2b4f; }
.pad button { flex: 1; border: 0; border-radius: 30px; display: grid; place-items: center; box-shadow: 0 10px 0 rgba(0, 0, 0, .3); }
.pad button svg { width: 50%; max-width: 140px; fill: #fff; }
.pad .left { background: #e63946; } .pad .right { background: #2a9d4b; }
.pad button.down { transform: translateY(8px); box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
</style>
</head>
<body>
<p class="status" id="status">در حال آماده شدن…</p>
<div class="top">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="side">
    <div class="clock" id="clock">0.000</div>
    <div class="opts">
      <select id="quality" aria-label="Quality"><option value="low">کیفیت کم (سریع‌تر)</option><option value="mid">کیفیت متوسط</option></select>
      <select id="codec" aria-label="Format"><option value="h264">فرمت H.264</option><option value="vp8">فرمت VP8</option></select>
    </div>
    <button class="go" id="go" type="button">وصل شو به تلویزیون</button>
    <button class="go go2" id="go2" type="button" hidden>راه دوم: با اجازهٔ میکروفون</button>
  </div>
</div>
<p class="diag" id="diag" hidden></p>
<div class="pad">
  <button class="left" data-d="-1" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 2-2-6.4-6 6.4-6z"/></svg></button>
  <button class="right" data-d="1" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-2-2 6.4-6-6.4-6z"/></svg></button>
</div>
<script src="auth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const say = (html) => { $("status").innerHTML = html; };
const cv = $("c"), g = cv.getContext("2d");

/* ---- The test game: catch the falling stars with the basket ---- */
const W = 1280, H = 720;
const st = { x: W / 2, dir: 0, stars: [], got: 0, t0: performance.now(), lastSpawn: 0 };
let actx = null, adest = null;
function beep() {
  if (!actx) return;
  const o = actx.createOscillator(), v = actx.createGain();
  o.frequency.value = 880; o.type = "sine";
  v.gain.setValueAtTime(0.25, actx.currentTime); v.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.25);
  o.connect(v); v.connect(adest); v.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.3);
}
function star(x, y, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function frame(now) {
  const dt = Math.min(50, now - (st.last || now)); st.last = now;
  st.x = Math.max(90, Math.min(W - 90, st.x + st.dir * dt * 0.9));
  if (now - st.lastSpawn > 700) { st.lastSpawn = now; st.stars.push({ x: 80 + Math.random() * (W - 160), y: -40, v: 0.25 + Math.random() * 0.2 }); }
  for (const s of st.stars) s.y += s.v * dt;
  st.stars = st.stars.filter((s) => {
    if (s.y > H - 120 && s.y < H - 60 && Math.abs(s.x - st.x) < 100) { st.got++; beep(); return false; }
    return s.y < H + 40;
  });
  // Sky, stars, basket, score.
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#1b2a6b"); sky.addColorStop(1, "#4a63c9");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = "#ffd23f"; for (const s of st.stars) star(s.x, s.y, 34);
  g.fillStyle = "#c97a3a"; g.beginPath(); g.moveTo(st.x - 90, H - 110); g.lineTo(st.x + 90, H - 110); g.lineTo(st.x + 65, H - 30); g.lineTo(st.x - 65, H - 30); g.closePath(); g.fill();
  g.fillStyle = "#fff"; g.font = "700 64px system-ui"; g.textAlign = "right"; g.fillText("⭐ " + st.got, W - 40, 80);
  // The clock: the same number shows on the phone; a photo of both shows the delay.
  const clock = ((now - st.t0) / 1000).toFixed(3);
  g.fillStyle = "rgba(0,0,0,.7)"; g.fillRect(30, 24, 330, 84);
  g.fillStyle = "#fff"; g.font = "700 60px ui-monospace, monospace"; g.textAlign = "left"; g.fillText(clock, 48, 88);
  $("clock").textContent = clock;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
for (const b of document.querySelectorAll(".pad button")) {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.classList.add("down"); st.dir = Number(b.dataset.d); if (navigator.vibrate) navigator.vibrate(15); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { b.classList.remove("down"); if (st.dir === Number(b.dataset.d)) st.dir = 0; });
}
document.addEventListener("contextmenu", (e) => e.preventDefault());

/* ---- Sending it to the TV ---- */
let pc = null;
if (!window.RTCPeerConnection || !cv.captureStream) { say("این مرورگر نمی‌تواند تصویر زنده بفرستد."); $("go").disabled = true; }
else if (!NT.base) { say("این صفحه روی این کامپیوتر به سرور وصل نیست. بازی را اینجا می‌شود امتحان کرد."); $("go").disabled = true; }
else if (!NT.token()) { say('اول با همین گوشی وارد حساب خانواده شوید: <a href="account.html">ورود</a>'); $("go").disabled = true; }
else say("اول روی تلویزیون <b>noyantv.com/stream-tv.html</b> را باز کنید، بعد «وصل شو» را بزنید.");

$("go").onclick = connect;
/* The second way: browsers hide the phone's address on the home network behind
   a made-up name (….local) that many TV browsers can't look up. After the page
   is allowed the microphone, the browser shows the real address. The
   microphone itself is switched off at once; nothing is recorded. */
$("go2").onclick = async () => {
  try { const m = await navigator.mediaDevices.getUserMedia({ audio: true }); m.getTracks().forEach((t) => t.stop()); }
  catch (e) { say("اجازهٔ میکروفون داده نشد، پس راه دوم امتحان نشد."); return; }
  connect();
};
// Which kinds of network address each side offered, in plain words.
function kinds(sdp) {
  const c = { "خانه (اسم پنهان)": 0, "خانه (آدرس واقعی)": 0, "اینترنت": 0, "رله": 0 };
  for (const line of new Set((sdp || "").split("\n").map((l) => l.trim()))) { // each address once
    const m = line.match(/^a=candidate:\S+ \d+ (\S+) \d+ (\S+) \d+ typ (\S+)/i);
    if (!m) continue;
    if (m[3] === "host") c[m[2].endsWith(".local") ? "خانه (اسم پنهان)" : "خانه (آدرس واقعی)"]++;
    else if (m[3] === "srflx" || m[3] === "prflx") c["اینترنت"]++;
    else if (m[3] === "relay") c["رله"]++;
  }
  const out = Object.entries(c).filter(([, n]) => n).map(([k, n]) => `${k}: ${n}`).join("، ");
  return out || "هیچ";
}
// Network help: Google's STUN finds the home's internet address; our relay
// (TURN, short-lived password from our server) carries the picture when the
// two can't reach each other directly.
async function iceServers() {
  const list = [{ urls: "stun:stun.l.google.com:19302" }];
  const r = await NT.call("/rtc/turn");
  // UDP only: TCP to the relay piles up delay (and each address takes one of the family's relay slots).
  if (r.ok && r.body && r.body.turn) list.push({ ...r.body.turn, urls: r.body.turn.urls.filter((u) => !/transport=tcp/.test(u)) });
  return list;
}
// ?relay in the address: only through our relay (to test that path on its own).
const RELAY_ONLY = new URLSearchParams(location.search).has("relay");
// Which way the picture goes: straight inside the home, or through our relay.
async function pathNow(pc) {
  const st = await pc.getStats();
  let pairId = null;
  st.forEach((r) => { if (r.type === "transport" && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId; });
  let pair = pairId ? st.get(pairId) : null;
  if (!pair) st.forEach((r) => { if (r.type === "candidate-pair" && r.state === "succeeded" && r.nominated) pair = r; });
  if (!pair) return "";
  const l = st.get(pair.localCandidateId), rm = st.get(pair.remoteCandidateId);
  const types = [l && l.candidateType, rm && rm.candidateType];
  if (types.includes("relay")) return "از راه سرور ما (فرانکفورت)";
  if (types.includes("srflx") || types.includes("prflx")) return "از راه اینترنت خانه";
  return "مستقیم داخل خانه";
}
// Short reports to our server about connecting (no picture, no addresses):
// whether a relay password came, which kinds of address were found, and why
// reaching the relay failed if it did. Read on the server to fix this test.
const VERSION = 10;
function report(ev, data = {}) { NT.call("/rtc/diag", { role: "phone", data: { ev, v: VERSION, ...data } }); }
function watchPc(pc, gotTurn) {
  report("start", { turn: gotTurn, ua: navigator.userAgent.slice(0, 140) });
  pc.addEventListener("icecandidate", (e) => { if (e.candidate) report("cand", { type: e.candidate.type, proto: e.candidate.protocol, relay: e.candidate.relayProtocol || "" }); else report("gathered"); });
  pc.addEventListener("icecandidateerror", (e) => report("cand-error", { code: e.errorCode, text: (e.errorText || "").slice(0, 80), url: e.url || "" }));
  pc.addEventListener("iceconnectionstatechange", () => report("state", { ice: pc.iceConnectionState, conn: pc.connectionState }));
  let sent = false;
  pc.addEventListener("connectionstatechange", async () => {
    if (sent || !["failed", "connected"].includes(pc.connectionState)) return;
    sent = true;
    const pairs = [];
    try {
      const st = await pc.getStats();
      st.forEach((r) => {
        if (r.type !== "candidate-pair" || pairs.length >= 25) return;
        const l = st.get(r.localCandidateId) || {}, rm = st.get(r.remoteCandidateId) || {};
        pairs.push([l.candidateType, (l.relayProtocol || l.protocol || ""), rm.candidateType, r.state, r.requestsSent || 0, r.responsesReceived || 0].join(" "));
      });
    } catch (err) {}
    report("end", { conn: pc.connectionState, pairs });
  });
}
/* One connection, one TV page: each try has its own code (sid). If more than
   one TV page is open and answers, only the first is used and the others are
   told to let go — mixing two TVs' answers left it stuck at "connecting". */
let sid = "", tvId = null;
const toTv = (msg, opts) => NT.call("/rtc", { to: "tv", msg: { ...msg, sid, tv: tvId } }, opts);
let tvSdp = "", videoSender = null, tvCands = [], myCands = [], early = [], offered = false;
const asLines = (list) => list.map((c) => "a=" + c.candidate).join("\n");
// A smaller picture (854×480) and a steady frame rate: less to squeeze, send and open.
// Set once the TV has answered (before that the browser may not take it).
// Low: 640×360, 20 frames a second, under 1 Mbit/s — less for a weak TV to open,
// so frames don't pile up. Middle: 854×480, 30 a second. Changes at once while connected.
const QUALITY = { low: { scale: 2, fps: 20, bps: 900000 }, mid: { scale: 1.5, fps: 30, bps: 2000000 } };
async function tuneSender(sender) {
  try {
    const q = QUALITY[$("quality").value] || QUALITY.low;
    const prm = sender.getParameters();
    if (!prm.encodings || !prm.encodings.length) return;
    prm.degradationPreference = "balanced";
    prm.encodings[0].scaleResolutionDownBy = q.scale;
    prm.encodings[0].maxBitrate = q.bps;
    prm.encodings[0].maxFramerate = q.fps;
    await sender.setParameters(prm);
  } catch (e) {}
}
$("quality").onchange = () => { if (videoSender) tuneSender(videoSender); };
$("codec").onchange = () => { if (pc && pc.connectionState === "connected") say("برای عوض شدن فرمت، دوباره «وصل شو» را بزنید."); $("go").disabled = false; };
async function showDiag() {
  let pairs = 0, tried = 0;
  try { (await pc.getStats()).forEach((r) => { if (r.type === "candidate-pair") { pairs++; if (r.requestsSent) tried++; } }); } catch (e) {}
  $("diag").hidden = false;
  $("diag").textContent = `آدرس‌های گوشی: ${kinds((pc.localDescription ? pc.localDescription.sdp : "") + "\n" + asLines(myCands))}\nآدرس‌های تلویزیون: ${tvSdp ? kinds(tvSdp + "\n" + asLines(tvCands)) : "جوابی نیامد"}\nراه‌های امتحان‌شده: ${tried} از ${pairs}\nنسخهٔ صفحه: ${VERSION}`;
}
async function connect() {
  $("go").disabled = true; tvSdp = ""; sid = Math.random().toString(36).slice(2, 12); tvId = null; tvCands = []; myCands = []; early = []; offered = false;
  say("دارم وصل می‌شوم…");
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); adest = actx.createMediaStreamDestination(); }
  const r = await NT.call("/rtc/ticket", { role: "phone" });
  if (!r.ok) { say("به سرور وصل نشد."); $("go").disabled = false; return; }
  const es = new EventSource(NT.base + "/rtc/listen?t=" + encodeURIComponent(r.body.ticket));
  let chain = Promise.resolve();
  es.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    chain = chain.then(async () => { // in order: the answer before its addresses
      if (m.sid !== sid) return; // from an earlier try
      if (m.type === "answer" && pc) {
        if (tvId) { report("second-tv"); return; } // another TV page answered too: ignored
        tvId = m.tv;
        toTv({ type: "chosen" }); // the other TV pages let go
        tvSdp = m.sdp;
        await pc.setRemoteDescription({ type: "answer", sdp: m.sdp });
        if (videoSender) tuneSender(videoSender);
        say("تلویزیون جواب داد…");
        report("answer", { tv: kinds(m.sdp) });
        for (const c of early.splice(0)) { try { await pc.addIceCandidate(c); } catch (err) {} }
      } else if (m.type === "ice" && pc) {
        if (m.tv !== tvId) return; // not from the chosen TV
        tvCands.push(m.c);
        if (pc.remoteDescription) { try { await pc.addIceCandidate(m.c); } catch (err) {} } else early.push(m.c);
      }
    }).catch(() => {});
  };
  await new Promise((ok) => { es.onopen = ok; setTimeout(ok, 3000); });
  if (pc) pc.close();
  const servers = await iceServers();
  pc = new RTCPeerConnection({ iceServers: servers, iceTransportPolicy: RELAY_ONLY ? "relay" : "all" });
  watchPc(pc, servers.length > 1);
  const video = cv.captureStream(30);
  for (const t of video.getVideoTracks()) {
    t.contentHint = "motion"; // a game: keep it smooth rather than sharp
    const sender = pc.addTrack(t, video);
    // The chosen format first (H.264: TVs often have a chip for it; VP8: sometimes faster when they don't).
    const tr = pc.getTransceivers().find((x) => x.sender === sender);
    try {
      const want = $("codec").value === "vp8" ? /vp8/i : /h264/i;
      const codecs = RTCRtpSender.getCapabilities("video").codecs;
      const first = codecs.filter((c) => want.test(c.mimeType));
      if (first.length && tr.setCodecPreferences) tr.setCodecPreferences([...first, ...codecs.filter((c) => !want.test(c.mimeType))]);
    } catch (e) {}
    videoSender = sender;
  }
  for (const t of adest.stream.getAudioTracks()) pc.addTrack(t, video);
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === "connected") { say("✔ وصل است. حالا به تلویزیون نگاه کنید و بازی کنید."); setTimeout(async () => { const way = await pathNow(pc); if (way) say("✔ وصل است، " + way + ". حالا به تلویزیون نگاه کنید و بازی کنید."); }, 1500); }
    if (s === "failed") { say("وصل نشد. گوشی و تلویزیون روی یک وای‌فای هستند؟ (گوشی روی اینترنت سیم‌کارت نباشد.) اگر بودند، «راه دوم» را بزنید."); $("go").disabled = false; $("go2").hidden = false; showDiag(); }
    if (s === "connected") $("diag").hidden = true;
    if (s === "disconnected") { say("قطع شد."); $("go").disabled = false; }
  };
  // Each network address goes to the TV as soon as it is found (the relay's can take a few seconds).
  pc.onicecandidate = (e) => { if (!e.candidate) return; myCands.push(e.candidate); if (offered) toTv({ type: "ice", c: e.candidate.toJSON() }); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise((done) => setTimeout(done, 600)); // the quick home addresses go in the offer itself
  const s = await toTv({ type: "offer", sdp: pc.localDescription.sdp, relay: RELAY_ONLY });
  offered = true;
  for (const c of myCands) if (!pc.localDescription.sdp.includes(c.candidate)) toTv({ type: "ice", c: c.toJSON() });
  if (!s.ok) { say("به سرور وصل نشد."); $("go").disabled = false; return; }
  if (!s.body.listeners) { say("تلویزیون هنوز آماده نیست. اول روی تلویزیون <b>noyantv.com/stream-tv.html</b> را باز کنید."); $("go").disabled = false; return; }
  setTimeout(() => { if (pc && !["connected", "failed"].includes(pc.connectionState)) { say(tvSdp ? "تلویزیون جواب داد ولی وصل نشد. «راه دوم» را امتحان کنید." : "تلویزیون جواب نداد. صفحهٔ تلویزیون باز است؟"); $("go").disabled = false; $("go2").hidden = false; showDiag(); } }, 15000);
}
addEventListener("pagehide", () => { if (pc) { toTv({ type: "bye" }, { keepalive: true }); pc.close(); } }); // also frees the relay slot
</script>
</body>
</html>
