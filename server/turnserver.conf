# Relay for the phone-to-TV stream test (noyantv.com stream-phone.html / stream-tv.html).
# Only used when the phone and the TV cannot reach each other directly.
listening-ip=206.189.49.4
relay-ip=206.189.49.4
external-ip=206.189.49.4
listening-port=3478
min-port=49160
max-port=49200
realm=noyantv.com
fingerprint
use-auth-secret
static-auth-secret=CHANGE-ME (openssl rand -hex 32; the same value goes in TURN_SECRET for kids-tube-stats)
no-tls
no-dtls
no-cli
no-multicast-peers
# Never relay into this server or any private network (only to real internet addresses).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Small limits: a few streams at a time, about 12 Mbit/s each at most.
user-quota=16
total-quota=32
max-bps=1500000
stale-nonce=600
syslog
simple-log
# Setup (Ubuntu): apt-get install coturn; copy this to /etc/turnserver.conf;
# ufw allow 3478/udp, 3478/tcp, 49160:49200/udp; and give kids-tube-stats
# TURN_SECRET and TURN_URLS in /etc/systemd/system/kids-tube-stats.service.d/turn.conf.
# The server's own public address is NOT a denied peer, so two sides that both
# go through the relay can reach each other (only logged-in families get a password).
