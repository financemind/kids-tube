<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d2b4f">
<title>گوشی: چشم بازی</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* Test: the phone's camera watches the child; a body-tracking model (MediaPipe
   Pose, run on the phone itself) finds the head, shoulders, hands, hips and
   knees, and the page decides which move it sees: hands up, arms out, sitting.
   Only that word goes to the TV (move-tv.html), never the picture. */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #14204a; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
body { display: flex; flex-direction: column; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)); }
.status { text-align: center; margin: 0; min-height: 3em; }
.status a { color: #ffd23f; }
.view { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; background: #000; }
video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
.now { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, .65); border-radius: 14px; padding: 6px 16px; font-size: 22px; font-weight: 700; white-space: nowrap; }
button.go { font: 700 18px/1 system-ui, sans-serif; border: 0; border-radius: 14px; padding: 14px; background: #f6c90e; color: #1d2b4f; }
button.go:disabled { opacity: .6; }
.note { margin: 0; font-size: 13px; opacity: .8; text-align: center; }
</style>
</head>
<body>
<p class="status" id="status">در حال آماده شدن…</p>
<div class="view"><video id="cam" playsinline muted></video><canvas id="dots"></canvas><div class="now" id="now" hidden></div></div>
<button class="go" id="go" type="button">روشن کردن دوربین</button>
<p class="note">تصویر دوربین از این گوشی بیرون نمی‌رود. فقط اسم حرکت (مثلاً «دست‌ها بالا») به تلویزیون فرستاده می‌شود.</p>
<script src="auth.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const say = (html) => { $("status").innerHTML = html; };
const LIB = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const NAMES = { up: "🙌 دست‌ها بالا", out: "🤸 دست‌ها باز", sit: "🧎 نشسته", stand: "🧍 ایستاده", none: "کسی دیده نمی‌شود" };

if (!NT.base) say("این صفحه روی این کامپیوتر به سرور وصل نیست. تشخیص حرکت را اینجا هم می‌شود امتحان کرد.");
else if (!NT.token()) say('اول با همین گوشی وارد حساب خانواده شوید: <a href="account.html">ورود</a>');
else say("اول روی تلویزیون <b>noyantv.com/move-tv.html</b> را باز کنید. بعد گوشی را رو به اتاق بگذارید، حدود ۲ تا ۳ متر دورتر، و دوربین را روشن کنید.");

/* Which move: from the body points (x, y from 0 to 1, y grows downwards).
   0 nose, 11/12 shoulders, 15/16 wrists, 23/24 hips, 25/26 knees. */
function classify(p) {
  if (!p || p.length < 27) return "none";
  const seen = (i) => (p[i].visibility ?? 1) > 0.5;
  if (!seen(0) || !seen(11) || !seen(12)) return "none";
  const sh = (p[11].y + p[12].y) / 2, shW = Math.abs(p[11].x - p[12].x) || 0.05;
  const wristsSeen = seen(15) && seen(16);
  if (wristsSeen && p[15].y < p[0].y && p[16].y < p[0].y) return "up";
  if (wristsSeen) {
    const midX = (p[11].x + p[12].x) / 2;
    const far = (w) => Math.abs(p[w].x - midX) > shW * 1.4;
    const level = (w) => Math.abs(p[w].y - sh) < shW * 0.7;
    if (far(15) && far(16) && level(15) && level(16)) return "out";
  }
  if (seen(23) && seen(24) && seen(25) && seen(26)) {
    const hip = (p[23].y + p[24].y) / 2, knee = (p[25].y + p[26].y) / 2, torso = hip - sh;
    if (torso > 0 && knee - hip < torso * 0.45) return "sit"; // thighs about level: sitting or squatting
  }
  return "stand";
}
window.classify = classify; // for testing

let landmarker = null, lastSent = "", candidate = "", since = 0;
function send(move) { if (NT.base && NT.token()) NT.call("/rtc", { to: "tv", msg: { type: "move", move } }); }

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    say("دارم برنامهٔ تشخیص بدن را می‌آورم (حدود ۶ مگابایت، فقط بار اول)…");
    const vision = await import(LIB + "/vision_bundle.mjs");
    const files = await vision.FilesetResolver.forVisionTasks(LIB + "/wasm");
    landmarker = await vision.PoseLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: MODEL, delegate: "GPU" }, runningMode: "VIDEO", numPoses: 1,
    });
    say("دوربین…");
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    $("cam").srcObject = stream; await $("cam").play();
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
    say(NT.base && NT.token() ? "✔ دوربین روشن است. حالا به تلویزیون نگاه کنید." : "✔ دوربین روشن است.");
    $("now").hidden = false;
    loop();
  } catch (e) {
    say("نشد: " + (e && e.name === "NotAllowedError" ? "اجازهٔ دوربین داده نشد." : String(e && e.message || e).slice(0, 120)));
    $("go").disabled = false;
  }
};

function loop() {
  const v = $("cam"), c = $("dots"), g = c.getContext("2d");
  let lastT = -1;
  const step = () => {
    if (v.readyState >= 2 && v.currentTime !== lastT) {
      lastT = v.currentTime;
      const res = landmarker.detectForVideo(v, performance.now());
      const p = res.landmarks && res.landmarks[0];
      c.width = v.videoWidth; c.height = v.videoHeight;
      g.clearRect(0, 0, c.width, c.height);
      if (p) {
        g.fillStyle = "#ffd23f";
        for (const i of [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]) { g.beginPath(); g.arc(p[i].x * c.width, p[i].y * c.height, 7, 0, 7); g.fill(); }
      }
      const move = classify(p);
      $("now").textContent = NAMES[move];
      // Send a move only when it has held for a moment (not every jumpy frame).
      if (move !== candidate) { candidate = move; since = performance.now(); }
      else if (move !== lastSent && performance.now() - since > 300) { lastSent = move; send(move); }
    }
    requestAnimationFrame(step);
  };
  step();
  setInterval(() => { if (lastSent) send(lastSent); }, 3000); // a reminder, in case a message was lost
}
</script>
</body>
</html>
